    const rates=[1,1.25,1.5,0.8];
    const cur=a.playbackRate||1;
    const idx=rates.indexOf(cur);
    const next=rates[(idx+1)%rates.length];
    a.playbackRate=next;
    const speedBtn=document.getElementById('guided-speed-btn');
    if(speedBtn)speedBtn.textContent=next+'x';
    toast('Playback speed: '+next+'x');
  },
  guidedReset(){
    const a=getGuidedAudio();
    a.currentTime=0;
    updateGuidedUIProgress();
    toast('Audio restarted');
  }
};

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');
  if(!a||a.disabled)return;
  const fn=ACT[a.dataset.act];
  if(fn)fn(a,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(!t)return;
  if(t.id==='note-date-picker'){
    if(t.value&&t.value<=today()){
      ui.date=t.value;
      render();
    }
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(!t||!t.matches)return;
  if(t.matches('textarea'))autosize(t);
  if(t.id==='guided-seek'){
    seekGuidedTo(Number(t.value));
  }else if(t.id==='diary-text'){
    const k=t.dataset.date||ui.date;
    setPersonalNote(k,t.value);
    const sv=document.getElementById('sv-diary');
    const n=(db.notes||{})[k];
    if(sv)sv.textContent=n&&n.at?'Saved '+fmtT(n.at):'';
  }else if(t.dataset&&t.dataset.q){
    const p=t.dataset.q.split(':'),sc=p[0],id=p[1],key=sc==='d'?ui.date:ui.wk;
    setAns(sc,key,id,t.value);
    const rec=sc==='d'?db.days[key]:db.weeks[key],a=rec&&rec.a&&rec.a[id],sv=document.getElementById('sv-'+id);
    if(sv)sv.textContent=a?'Saved '+fmtT(a.at):'';
  }else if(t.dataset&&t.dataset.note){
    setNote(ui.date,t.value);
    const d=db.days[ui.date],sv=document.getElementById('sv-note');
    if(sv)sv.textContent=d&&d.n?'Saved '+fmtT(d.n.at):'';
  }else if(t.id==='psearch')applySearch(t.value);
});
document.addEventListener('touchstart',e=>{
  if(e.target&&e.target.id==='guided-seek')e.target.dataset.dragging='1';
},{passive:true});
document.addEventListener('touchend',e=>{
  if(e.target&&e.target.id==='guided-seek'){
    delete e.target.dataset.dragging;
    seekGuidedTo(Number(e.target.value));
  }
});
document.addEventListener('mousedown',e=>{
  if(e.target&&e.target.id==='guided-seek')e.target.dataset.dragging='1';
});
document.addEventListener('mouseup',e=>{
  if(e.target&&e.target.id==='guided-seek'){
    delete e.target.dataset.dragging;
    seekGuidedTo(Number(e.target.value));
  }
});
$('#filein').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>doImport(String(r.result||''));
  r.onerror=()=>toast('Could not read that file');
  r.readAsText(f);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')flush();
  else{
    if(ui.tday!==today()){ui.tday=today();ui.date=today();ui.wk=wkStart(today());ui.tw=ui.wk;ui.mon=monStart(today())}
    if(ui.route==='home'||ui.route==='guided')render();
  }
});
window.addEventListener('pagehide',flush);

/* ============ start ============ */
function init(){
  db=load();
  ui.route=parseHash();
  render(true);
  const hero=$('#hero');
  requestAnimationFrame(()=>hero.classList.add('in'));
  setTimeout(()=>hero.classList.add('out'),1500);
  setTimeout(()=>{if(hero.parentNode)hero.parentNode.removeChild(hero)},2500);
  try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(window.MutationObserver){
    const themeObs=new MutationObserver(()=>{if(ui.route==='home')render()});
    themeObs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  }
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(ui.route==='home')render()});
  }
}
window.__sd={ACT,go,render,ui,init,get db(){return db},set db(v){db=v},buildTXT,buildNotesTXT,importText,importNotesText,computeReview,ctxFor,reviewStarts,vHome,unseenReview,addParam,setT,setAns,setNote,setPersonalNote,persist};
/* offline + installable */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
init();
</script>
</body>
</html>
