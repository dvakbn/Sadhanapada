<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Application Discontinued</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131A1B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #131A1B;
    --paper: #1A2223;
    --ink: #E7EBE6;
    --ink2: #AAB5B2;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #EBEEE9;
      --paper: #F6F7F3;
      --ink: #212A2C;
      --ink2: #4F5B5C;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 440px;
    width: 100%;
    background: var(--paper);
    padding: 40px 30px;
    border-radius: 22px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    border: 1px solid rgba(128, 128, 128, 0.15);
  }
  .icon-wrap {
    width: 52px;
    height: 52px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: rgba(128, 128, 128, 0.1);
    display: grid;
    place-items: center;
    color: var(--ink2);
  }
  .icon-wrap svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  h1 {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 400;
    margin: 0 0 12px;
    letter-spacing: 0.01em;
  }
  p {
    color: var(--ink2);
    font-size: 15px;
    line-height: 1.6;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <line x1="5.7" y1="5.7" x2="18.3" y2="18.3"/>
      </svg>
    </div>
    <h1>Application Discontinued</h1>
    <p>This application has been permanently discontinued. All cached assets and local storage have been cleared.</p>
  </div>

  <script>
    // 1. Purge Cache Storage
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      }).catch(function() {});
    }

    // 2. Unregister all Service Workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      }).catch(function() {});
      navigator.serviceWorker.register('sw.js?v=' + Date.now()).catch(function() {});
    }

    // 3. Clear Local Storage, Session Storage & Cookies
    try { localStorage.clear(); } catch(e) {}
    try { sessionStorage.clear(); } catch(e) {}
    try {
      document.cookie.split(";").forEach(function(c) {
        document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
      });
    } catch(e) {}

    // 4. Delete IndexedDB
    if ('indexedDB' in window) {
      try { indexedDB.deleteDatabase('SadhanapadaFileHandles'); } catch(e) {}
      try { indexedDB.deleteDatabase('SadhanapadaFileHandlesDB'); } catch(e) {}
    }
  </script>
</body>
</html>
