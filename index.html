<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sadhanapada</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EBEEE9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DFE4DC; --paper:#F4F6F1; --ink:#1A2526; --ink2:#3E4C4E; --ink3:#697779; --line:#B8C2B4; --line2:#CDD6C9; --fill:#D0D9CC;
  --bark:#82624A; --lichen:#4E785C; --stone:#4A6B7C; --dusk:#6F5882; --amber:#A86D22;
  --t-bark:rgba(130,98,74,.14); --t-lichen:rgba(78,120,92,.14); --t-stone:rgba(74,107,124,.14); --t-dusk:rgba(111,88,130,.14); --t-amber:rgba(168,109,34,.14);
  --hi:#3B6B4C; --mid:#8C6E25; --lo:#6B5982; --warn:#96433E;
  --grad-bg:radial-gradient(ellipse at 50% 0%, rgba(248, 245, 238, 0.7) 0%, rgba(223, 228, 220, 0.85) 100%);
  --card-bg:linear-gradient(168deg, rgba(255,255,255,0.7) 0%, var(--paper) 100%);
  --ease:cubic-bezier(.22,.7,.2,1);
  --serif:'Marcellus',Georgia,'Times New Roman',serif;
  --sans:'Mulish',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1719; --paper:#182427; --ink:#F3F7F2; --ink2:#C5D4CF; --ink3:#94A5A1; --line:#2B3B3E; --line2:#223032; --fill:#223134;
    --bark:#E2C8B1; --lichen:#A2CBAF; --stone:#9BBAD0; --dusk:#CAB9D9; --amber:#F2C678;
    --t-bark:rgba(226,200,177,.14); --t-lichen:rgba(162,203,175,.14); --t-stone:rgba(155,186,208,.14); --t-dusk:rgba(202,185,217,.14); --t-amber:rgba(242,198,120,.14);
    --hi:#A2D6B6; --mid:#ECCF7C; --lo:#CBBDE0; --warn:#E8A39E;
    --grad-bg:radial-gradient(ellipse at 50% 0%, rgba(28, 41, 44, 0.85) 0%, rgba(15, 23, 25, 0.95) 100%);
    --card-bg:linear-gradient(168deg, rgba(28, 41, 44, 0.9) 0%, var(--paper) 100%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1719; --paper:#182427; --ink:#F3F7F2; --ink2:#C5D4CF; --ink3:#94A5A1; --line:#2B3B3E; --line2:#223032; --fill:#223134;
  --bark:#E2C8B1; --lichen:#A2CBAF; --stone:#9BBAD0; --dusk:#CAB9D9; --amber:#F2C678;
  --t-bark:rgba(226,200,177,.14); --t-lichen:rgba(162,203,175,.14); --t-stone:rgba(155,186,208,.14); --t-dusk:rgba(202,185,217,.14); --t-amber:rgba(242,198,120,.14);
  --hi:#A2D6B6; --mid:#ECCF7C; --lo:#CBBDE0; --warn:#E8A39E;
  --grad-bg:radial-gradient(ellipse at 50% 0%, rgba(28, 41, 44, 0.85) 0%, rgba(15, 23, 25, 0.95) 100%);
  --card-bg:linear-gradient(168deg, rgba(28, 41, 44, 0.9) 0%, var(--paper) 100%);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{background:var(--bg);background-image:var(--grad-bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:transparent;color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
.ic svg,.ib svg,.mk svg,.tog svg,.opt svg,.ric svg,.sbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--stone);outline-offset:2px}

/* ---------- hero ---------- */
#hero{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;opacity:1;transition:opacity .8s ease,background .3s;pointer-events:auto}
#hero.out{opacity:0;pointer-events:none}
#hero .hmark{position:absolute;width:min(66vw,360px);height:auto;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .7s ease,transform .9s var(--ease);filter:drop-shadow(0 2px 20px rgba(0,0,0,.16))}
#hero.in .hmark{opacity:1;transform:none}
#hero .hmark.dark{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #hero .hmark.light{display:none}
  :root:not([data-theme="light"]) #hero .hmark.dark{display:block;filter:drop-shadow(0 2px 22px rgba(0,0,0,.45))}
}
:root[data-theme="dark"] #hero .hmark.light{display:none}
:root[data-theme="dark"] #hero .hmark.dark{display:block;filter:drop-shadow(0 2px 22px rgba(0,0,0,.45))}

/* ---------- layout ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh}
#view.enter{animation:vin .22s ease both}
@keyframes vin{from{opacity:0}to{opacity:1}}
.pg{padding:0 20px 90px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 12px 8px}
.top-in{display:flex;align-items:center;gap:6px;min-height:44px}
.top h1{font:400 24px/1.2 var(--serif);flex:1;letter-spacing:.005em}
.top-r{display:flex;gap:2px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink2)}
.ib:active{background:var(--fill)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 8px 6px;scrollbar-width:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink2);padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;transition:background .12s,transform .12s}
.chip:active{background:var(--fill);transform:scale(.96)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sm{padding:5px 11px;font-size:13px}

.seg{display:flex;background:var(--fill);border-radius:999px;padding:4px;margin:8px 0 14px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

.dnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px}
.dnav .dl{text-align:center}
.dnav .dl b{display:block;font:400 22px/1.2 var(--serif)}
.dnav .dl small{color:var(--ink3);font-size:13px}
.dnav button:disabled{opacity:.25}

.sv{font-size:12px;color:var(--ink3);min-height:18px;padding:3px 2px 0}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:14.5px;color:var(--ink);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:13.5px}

/* ---------- home ---------- */
.home-top{position:relative;padding:16px 20px 6px;overflow:hidden}
.sky{width:100%;height:auto;display:block;overflow:visible;pointer-events:none}
.sky .glow-outer{animation:skyBreathe 7s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
.sky .glow-inner{animation:skyPulse 5s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
.sky .star{animation:starTwinkle 3.2s ease-in-out infinite alternate, starDrift1 22s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
.sky .star.drift-1{animation:starTwinkle 3.2s ease-in-out infinite alternate, starDrift1 22s ease-in-out infinite alternate}
.sky .star.drift-2{animation:starTwinkle 4.1s ease-in-out infinite alternate, starDrift2 26s ease-in-out infinite alternate;animation-delay:0.8s, 2s}
.sky .star.drift-3{animation:starTwinkle 2.8s ease-in-out infinite alternate, starDrift3 20s ease-in-out infinite alternate;animation-delay:1.5s, 4s}
.sky .star.drift-4{animation:starTwinkle 3.6s ease-in-out infinite alternate, starDrift4 24s ease-in-out infinite alternate;animation-delay:2.2s, 1s}

@keyframes skyBreathe{from{opacity:0.65;transform:scale(0.96)}to{opacity:0.95;transform:scale(1.05)}}
@keyframes skyPulse{from{opacity:0.75}to{opacity:1.0}}
@keyframes starTwinkle{from{opacity:0.25;transform:scale(0.85)}to{opacity:0.95;transform:scale(1.2)}}

@keyframes starDrift1{
  0%{transform:translate(0px,0px) scale(0.85)}
  25%{transform:translate(4px,-3px) scale(1.1)}
  50%{transform:translate(-2px,-5px) scale(0.95)}
  75%{transform:translate(-4px,2px) scale(1.15)}
  100%{transform:translate(2px,3px) scale(0.9)}
}
@keyframes starDrift2{
  0%{transform:translate(0px,0px) scale(0.9)}
  25%{transform:translate(-4px,3px) scale(1.15)}
  50%{transform:translate(3px,4px) scale(0.85)}
  75%{transform:translate(5px,-2px) scale(1.1)}
  100%{transform:translate(-2px,-4px) scale(0.95)}
}
@keyframes starDrift3{
  0%{transform:translate(0px,0px) scale(0.95)}
  25%{transform:translate(3px,4px) scale(1.05)}
  50%{transform:translate(-4px,1px) scale(1.2)}
  75%{transform:translate(2px,-4px) scale(0.85)}
  100%{transform:translate(-3px,2px) scale(1.1)}
}
@keyframes starDrift4{
  0%{transform:translate(0px,0px) scale(0.85)}
  25%{transform:translate(-3px,-4px) scale(1.2)}
  50%{transform:translate(4px,-1px) scale(0.9)}
  75%{transform:translate(-2px,4px) scale(1.15)}
  100%{transform:translate(3px,-2px) scale(0.95)}
}

@media (hover: hover) {
  .row, .rrow, .card, .pcard, .sopt, .diary-card, .minor .row, .banner {
    transition: transform 0.28s var(--ease), box-shadow 0.28s ease, border-color 0.28s ease, background 0.28s ease;
  }
  .row:hover, .rrow:hover, .minor .row:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px -3px rgba(29,38,40,0.08), 0 2px 6px -1px rgba(0,0,0,0.03);
    border-color: var(--line);
  }
  .card, .diary-card, .paper, .banner {
    background: var(--card-bg);
    box-shadow: 0 4px 18px -2px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.03);
  }
  .card:hover, .pcard:hover, .diary-card:hover, .banner:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px -4px rgba(29,38,40,0.09), 0 2px 8px -1px rgba(0,0,0,0.04);
  }
  .sopt:hover {
    border-color: var(--ink3);
    transform: translateY(-1.5px);
    box-shadow: 0 6px 16px -2px rgba(0,0,0,0.05);
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.09);
  }
  .chip:hover {
    transform: translateY(-1px);
  }
}
.greet{margin-top:6px;color:var(--ink2);font-size:15px}
.home-top h1{font:400 clamp(30px,8vw,38px)/1.15 var(--serif);margin-top:2px;letter-spacing:.005em}
.rows{display:grid;gap:12px;margin:14px 0 18px}
.row{--a:var(--bark);--t:var(--t-bark);display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:15px 18px;border-radius:22px;border:1px solid var(--line2);border-left:4px solid var(--a);background:var(--t);transition:transform .15s var(--ease), box-shadow .2s ease, border-color .2s ease}
.row:active{transform:scale(.985)}
.ric{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--a);background:var(--paper);border:1px solid var(--a);box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.rt{flex:1;min-width:0}
.rt b{display:block;font:400 20px/1.25 var(--serif);letter-spacing:.005em}
.rt small{display:block;color:var(--ink2);font-size:13.5px;line-height:1.35;margin-top:1px}
.row .chev{color:var(--ink3);width:18px;flex:none}
.row .chev svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.c-params{--a:var(--bark);--t:var(--t-bark)}
.c-track{--a:var(--lichen);--t:var(--t-lichen)}
.c-guided{--a:var(--hi);--t:var(--t-lichen)}
.c-practices{--a:var(--stone);--t:var(--t-stone)}
.c-notes{--a:var(--dusk);--t:var(--t-dusk)}
.c-yoga{--a:var(--stone);--t:var(--t-stone)}
.c-angamardhana{--a:var(--bark);--t:var(--t-bark)}
.c-shakti{--a:var(--dusk);--t:var(--t-dusk)}
.c-surya{--a:var(--amber);--t:var(--t-amber)}
.card-logo{width:34px;height:34px;object-fit:contain;display:block;filter:contrast(1.6) drop-shadow(0 0 0.5px rgba(0,0,0,0.6))}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .card-logo{filter:invert(1) brightness(1.3) contrast(1.6) drop-shadow(0 0 0.5px rgba(255,255,255,0.6))}
}
:root[data-theme="dark"] .card-logo{filter:invert(1) brightness(1.3) contrast(1.6) drop-shadow(0 0 0.5px rgba(255,255,255,0.6))}
.privacy-badge{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--t-lichen);color:var(--ink2);font-size:13.5px;line-height:1.4;margin:12px 0}
.minor{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.minor .row{padding:12px 14px;border-radius:18px;background:transparent;border:1px solid var(--line);gap:12px}
.minor .ric{width:38px;height:38px}
.minor .rt b{font-size:17px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--paper);border:1px solid var(--line);margin:0 0 10px}
.banner p{flex:1;font-size:14px;line-height:1.4}
.banner p b{font-weight:700}
.banner.warn{border-color:var(--warn)}

/* ---------- diary / notes ---------- */
.diary-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,0.03)}
.diary-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.diary-head b{font:400 20px var(--serif);color:var(--ink)}
.diary-tb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.diary-area{width:100%;min-height:240px;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:14px;font:400 16px/1.65 var(--sans);color:var(--ink);outline:none;resize:none}
.diary-area:focus{border-color:var(--stone);box-shadow:0 0 0 3px var(--t-stone)}

/* ---------- questions ---------- */
.q{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:20px 0;border-bottom:1px solid var(--line2)}
.qb{min-width:0}
.qt,.qs2{overflow-wrap:anywhere}
.qn{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.qt{font:400 19px/1.35 var(--serif);display:block;letter-spacing:.005em}
.qs2{font:400 17px/1.4 var(--serif);display:block}
.qs2 i{font-style:normal;color:var(--ink3);margin-right:2px}
.qlbl{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.qlbl label{flex:1;min-width:0}
.qhint{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink3);font:700 12px var(--sans);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1;margin-top:2px;transition:background .15s,color .15s,border-color .15s}
.qhint:active,.qhint.on{background:var(--fill);color:var(--ink);border-color:transparent}
.qh{font-size:13.5px;line-height:1.5;color:var(--ink3);margin:6px 0 2px;padding:8px 12px;border-radius:10px;background:var(--fill)}
details.hint{margin-top:6px}
details.hint summary{list-style:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);color:var(--ink3);font:700 11.5px var(--sans);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary::marker{content:''}
details.hint[open] summary{background:var(--fill);color:var(--ink2);border-color:transparent}
.fld{margin-top:10px}
.fld:first-child{margin-top:0}
textarea,input[type=text],input[type=time]{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:12px 14px;font:400 16px/1.5 var(--sans);color:var(--ink);resize:none;outline:none;display:block;margin-top:8px}
textarea:focus,input[type=text]:focus,input[type=time]:focus{border-color:var(--stone);box-shadow:0 0 0 3px var(--t-stone)}
textarea{min-height:52px}
::placeholder{color:var(--ink3);opacity:.8}
.subh{font:400 21px/1.3 var(--serif);margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line)}

/* ---------- history ---------- */
details.hg{border-bottom:1px solid var(--line2);padding:2px 0}
details.hg summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 2px;cursor:pointer}
details.hg summary::-webkit-details-marker{display:none}
details.hg summary .hd{flex:1}
details.hg summary b{display:block;font:400 18px/1.3 var(--serif)}
details.hg summary small{color:var(--ink3);font-size:13px}
details.hg summary .cv{transition:transform .2s;color:var(--ink3)}
details.hg[open] summary .cv{transform:rotate(90deg)}
.cv svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hbody{padding:0 2px 16px}
.ha{margin-top:12px}
.ha .hq{font-size:13.5px;color:var(--ink3);line-height:1.4}
.ha .hx{white-space:pre-wrap;margin-top:2px;line-height:1.5}
.ha .ht{font-size:12px;color:var(--ink3)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--t-bark);color:var(--ink2);margin-left:6px;vertical-align:2px}
.tag.w{background:var(--t-dusk)}

/* ---------- tracker: day ---------- */
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line2)}
.tl{min-width:0;flex:1}
.trow.stack{flex-direction:column;align-items:flex-start;gap:10px}
.trow.stack .ctl{width:100%}
.trow.stack .opts{justify-content:flex-start;flex-wrap:nowrap}
.trow.stack .opt{flex:1;max-width:60px}
.tn{font:400 18px/1.3 var(--serif);overflow-wrap:anywhere}
.tm{font-size:12.5px;color:var(--ink3)}
.ctl{flex:none}
.tog{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink3);display:grid;place-items:center;transition:background .15s,border-color .15s}
.tog:not(.on) svg{opacity:.3}
.tog.on{background:var(--hi);border-color:var(--hi);color:#fff}
.tog.star.on{background:transparent;border-color:var(--amber);color:var(--amber)}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.opt{min-width:44px;height:44px;padding:0 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink2);display:grid;place-items:center;font:700 15px var(--sans);transition:background .15s}
.opt.fill{background:var(--t-lichen);border-color:transparent}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.glyph{font-size:20px;line-height:1}
.step{display:flex;align-items:center;gap:6px}
.step b{min-width:38px;text-align:center;font:700 19px var(--sans)}
.step .opt{min-width:40px;height:40px}
.notes{margin-top:22px}
.notes>label{font:400 19px var(--serif)}
.empty{text-align:center;padding:36px 10px 10px}
.empty h2{font:400 22px/1.3 var(--serif);margin-bottom:6px}
.empty p{color:var(--ink2);font-size:14.5px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0}

/* ---------- tracker: week (paper) ---------- */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 8px 14px;margin:6px -8px 0}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 6px;margin-bottom:12px}
.p-title{font:400 27px/1 var(--serif)}
.p-range{font-size:13px;color:var(--ink2);text-align:right}
.p-range u{text-decoration:none;border-bottom:1px solid var(--ink3);padding:0 6px}
.pnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.g{display:grid;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.g>*{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:42px;min-width:0;display:flex;align-items:center;justify-content:center}
.g .gh{background:var(--fill);flex-direction:column;font-size:11.5px;line-height:1.15;color:var(--ink2);min-height:48px;padding:2px 0}
.g .gh b{font-size:13px;font-weight:700;color:var(--ink)}
.g button.gh{border-top:0;border-left:0;border-radius:0}
.g .gh.today b{background:var(--ink);color:var(--bg);border-radius:50%;min-width:22px;height:22px;display:grid;place-items:center}
.g .gh.lab{font:400 15px var(--serif);color:var(--ink)}
.g .gn{justify-content:flex-start;padding:4px 8px;text-align:left;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.g .gt{font-size:11.5px;color:var(--ink3);flex-direction:column;line-height:1.2;text-align:center}
.cell{background:transparent;padding:0;border-top:0;border-left:0;border-radius:0;color:inherit}
.cell:active{background:var(--fill)}
.cell.fut{opacity:.35;pointer-events:none}
.cell.sel{background:var(--t-lichen)}
.mk{display:inline-grid;place-items:center;color:var(--ink2)}
.mk svg{width:19px;height:19px}
.mk.hi{color:var(--hi)}.mk.mid{color:var(--mid)}.mk.lo{color:var(--lo)}.mk.amber{color:var(--amber)}
.mk.num{font:700 14px var(--sans)}
.wnotes{margin-top:14px;padding:0 6px}
.wnotes .wt{font:400 17px var(--serif)}
.wn{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px;color:var(--ink2);line-height:1.4}
.wn b{color:var(--ink);font-weight:700;margin-right:6px}
.wl{height:30px;border-bottom:1px solid var(--line)}
.hint{font-size:13px;color:var(--ink3);margin-top:12px;text-align:center}

/* ---------- tracker: month ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;margin-top:12px}
.cal .wd{text-align:center;font-size:12px;color:var(--ink3);font-weight:600}
.cd{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;color:inherit}
.cd[disabled]{opacity:.3}
.ring{--p:0deg;width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--lichen) 0 var(--p),var(--line2) 0);position:relative;display:grid;place-items:center}
.ring::before{content:'';position:absolute;inset:3.5px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;font-size:14px}
.cd.today .ring span{font-weight:800}
.cd.sel .ring::before{background:var(--fill)}
.dot{width:4px;height:4px;border-radius:50%;background:var(--bark);opacity:0}
.dot.on{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--ink3);margin-top:16px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lichen);margin-right:6px}
.legend i.b{background:var(--bark)}
.stat{margin-top:18px;text-align:center;color:var(--ink2);font-size:14.5px}

/* ---------- manage ---------- */
.mrow{display:flex;align-items:center;gap:6px;padding:12px 0;border-bottom:1px solid var(--line2)}
.mrow .mi{flex:1;min-width:0}
.mrow .mi b{display:block;font:400 18px/1.3 var(--serif);overflow-wrap:anywhere}
.mrow .mi small{color:var(--ink3);font-size:13px}
.mrow .ib{width:38px;height:38px}
.mrow .ib svg{width:19px;height:19px}
.lab{font:700 13px var(--sans);color:var(--ink2);margin:16px 0 4px;display:block}
.types{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sopts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper)}
.sopt.on{border-color:var(--ink)}
.sopt .pv{display:flex;gap:8px;color:var(--ink2)}
.sopt .pv .mk svg,.sopt .pv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sopt .pv .glyph{font-size:18px}

/* ---------- sheet & toast ---------- */
.sheet{position:fixed;inset:0;z-index:60;pointer-events:none;visibility:hidden}
.sheet.open{pointer-events:auto;visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(18,24,25,.42);opacity:0;transition:opacity .25s}
.sheet.open .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(104%);transition:transform .3s var(--ease);max-height:90%;overflow:auto;box-shadow:0 -1px 0 var(--line)}
.sheet.open .panel{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.panel h2{font:400 23px/1.25 var(--serif)}
.panel .sub{color:var(--ink3);font-size:13.5px;margin-top:2px}
.panel .ctl-big{margin:20px 0 6px;display:flex;justify-content:center}
.panel .ctl-big .opts{justify-content:center}
.panel .ctl-big .opt{min-width:52px;height:52px}
.panel .ctl-big .step .opt{min-width:48px;height:48px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s var(--ease);z-index:80;pointer-events:none;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- practice pages ---------- */
.search{position:relative;margin:4px 0 6px}
.search input{margin:0;padding-left:42px;border-radius:999px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;fill:none;stroke:var(--ink3);stroke-width:1.6;stroke-linecap:round}
.psec{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px);padding-top:26px}
.psec>h2{font:400 24px/1.25 var(--serif);margin-bottom:6px}
.psec>.psub{color:var(--ink3);font-size:13.5px;margin-bottom:8px}
.ph{font:700 13.5px var(--sans);color:var(--ink2);margin:16px 0 6px}
.pp{margin:8px 0;color:var(--ink2);line-height:1.6}
.pnote{margin:10px 0;padding:12px 14px;border-radius:14px;background:var(--t-amber);font-size:14.5px;line-height:1.55}
.pul,.pol{margin:8px 0;padding-left:0;list-style:none;display:grid;gap:8px}
.pul li{position:relative;padding-left:20px;line-height:1.55}
.pul li::before{content:'';position:absolute;left:5px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.pol{counter-reset:o}
.pol li{position:relative;padding-left:32px;line-height:1.55;counter-increment:o}
.pol li::before{content:counter(o);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.pitem{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:baseline}
.pitem .pn{color:var(--ink3);font-size:13px;font-weight:700}
.pitem .pnm{font-size:16.5px;font-weight:700;line-height:1.35}
.pitem .pnm i{font-weight:400;color:var(--ink2)}
.pitem .prp{font-size:13.5px;color:var(--ink2);text-align:right;line-height:1.35;max-width:120px}
.pitem .psb{grid-column:2/4;font-size:14px;color:var(--ink2);display:flex;justify-content:space-between;gap:10px;line-height:1.4}
.pitem .pno{grid-column:2/4;font-size:13.5px;color:var(--ink3)}
.pitem.opt2 .pnm{font-weight:500;color:var(--ink2)}
.pgroup{margin:6px 0 0;padding:10px 0 2px;border-bottom:1px solid var(--line2)}
.pgroup .pgh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pgroup .pgh b{font:400 18px/1.3 var(--serif)}
.pgroup .pgh span{font-size:13.5px;color:var(--ink2)}
.pgroup .pitem:last-child{border-bottom:0}
.pcard{padding:14px 16px;border-radius:16px;background:var(--t-dusk);margin:10px 0}
.pcard .pch{font:400 18px/1.3 var(--serif);margin-bottom:3px}
.pcard p{font-size:14.5px;line-height:1.55;color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line2);color:var(--ink2)}
.pattern{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.pattern div{background:var(--t-dusk);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;line-height:1.3;color:var(--ink2)}
.pattern b{display:block;font:400 26px/1.1 var(--serif);color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:14.5px}
.tbl th{text-align:left;font-size:12.5px;color:var(--ink3);font-weight:700;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 6px 9px 0;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.4}
.tbl.num td:first-child{color:var(--ink3);font-weight:700;width:30px}
.tbl tr.sepr td{background:var(--t-amber);color:var(--ink2);font-size:13.5px;text-align:center;padding:8px}
.tbl small{display:block;color:var(--ink3);font-size:12.5px}
.tbl .e{color:var(--ink);font-weight:700}
.stepsl{display:grid;gap:0;margin:8px 0;padding:0;list-style:none;counter-reset:s}
.stepsl li{display:flex;justify-content:space-between;gap:12px;padding:11px 0 11px 34px;border-bottom:1px solid var(--line2);position:relative;counter-increment:s;line-height:1.4}
.stepsl li::before{content:counter(s);position:absolute;left:0;top:11px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.stepsl li span:first-child{font-weight:700}
.stepsl li span:last-child{color:var(--ink2);font-size:14px;text-align:right}
.nomatch{text-align:center;color:var(--ink3);padding:30px 0}

/* ---------- reviews ---------- */
.rlist{display:grid;gap:10px;margin:8px 0 18px}
.rrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--paper)}
.rrow b{display:block;font:400 18px/1.3 var(--serif)}
.rrow small{color:var(--ink3);font-size:13px}
.rrow .rt2{flex:1}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--t-lichen);color:var(--ink2)}
.pill.new{background:var(--amber);color:#20180a}
.pill.live{background:var(--fill)}
.rv h2.big{font:400 28px/1.2 var(--serif);margin:6px 0 2px}
.rv .lead{color:var(--ink2);font-size:14.5px;margin-bottom:6px}
.rb{margin-top:24px}
.rb h3{display:flex;align-items:center;gap:10px;font:400 21px/1.3 var(--serif);margin-bottom:6px}
.rb h3 .dotc{width:10px;height:10px;border-radius:50%}
.rb ul{margin:0;padding:0;list-style:none;display:grid;gap:0}
.rb li{padding:11px 0;border-bottom:1px solid var(--line2);font-size:15px;line-height:1.5}
.rb li b{font-weight:800}
.rb .none{color:var(--ink3);font-size:14px;padding:6px 0}
.b-well .dotc{background:var(--hi)}.b-improved .dotc{background:var(--lichen)}.b-declined .dotc{background:var(--lo)}.b-wrong .dotc{background:var(--warn)}.b-focus .dotc{background:var(--amber)}
.ntbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.ntbl th{text-align:left;font-size:12.5px;color:var(--ink3);font-weight:700;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.ntbl td{padding:9px 6px 9px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.ntbl td.up{color:var(--hi);font-weight:700}.ntbl td.dn{color:var(--warn);font-weight:700}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.words span{padding:5px 12px;border-radius:999px;background:var(--t-bark);font-size:14px}
.words span em{font-style:normal;color:var(--ink3);margin-left:4px;font-size:12.5px}
.foot{margin-top:26px;font-size:13px;color:var(--ink3);line-height:1.5}

/* ---------- backup ---------- */
.card{padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--paper);margin:10px 0}
.card h3{font:400 19px/1.3 var(--serif);margin-bottom:4px}
.card p{font-size:14.5px;color:var(--ink2);line-height:1.55}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:700;text-align:right}
pre.jr{white-space:pre-wrap;word-break:break-word;font:400 13px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;color:var(--ink)}
.hiddenfile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  #hero{transition:opacity .3s}
}
</style>
</head>

<script>
'use strict';
/* ============ utilities ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pk=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(k,n)=>{const d=pk(k);d.setDate(d.getDate()+n);return dkey(d)};
const today=()=>dkey(new Date());
const wkStart=k=>{const d=pk(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)};
const diffD=(a,b)=>Math.round((pk(b)-pk(a))/864e5);
const range=(a,b)=>{const o=[];let k=a,g=0;while(k<=b&&g++<4000){o.push(k);k=addD(k,1)}return o};
const monStart=k=>k.slice(0,7)+'-01';
const monEnd=k=>{const d=pk(k);return dkey(new Date(d.getFullYear(),d.getMonth()+1,0))};
const addM=(k,n)=>{const d=pk(k);return dkey(new Date(d.getFullYear(),d.getMonth()+n,1))};
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONS=MON.map(m=>m.slice(0,3));
const DAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS=DAY.map(d=>d.slice(0,3));
const fmtLong=k=>{const d=pk(k),y=d.getFullYear()===new Date().getFullYear();return DAY[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+(y?'':' '+d.getFullYear())};
const fmtShort=k=>{const d=pk(k);return d.getDate()+' '+MONS[d.getMonth()]};
const fmtFull=k=>{const d=pk(k);return d.getDate()+' '+MONS[d.getMonth()]+' '+d.getFullYear()};
const fmtRange=(a,b)=>{const x=pk(a),y=pk(b);const yr=y.getFullYear()!==new Date().getFullYear()?' '+y.getFullYear():'';return (x.getMonth()===y.getMonth()?x.getDate():x.getDate()+' '+MONS[x.getMonth()])+' – '+y.getDate()+' '+MONS[y.getMonth()]+yr};
const fmtT=iso=>{const d=new Date(iso);if(isNaN(d))return '';let h=d.getHours();const m=pad(d.getMinutes());const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+m+' '+ap};
const fmtDT=iso=>{const d=new Date(iso);return isNaN(d)?'':d.getDate()+' '+MONS[d.getMonth()]+' '+d.getFullYear()+', '+fmtT(iso)};
const fmtHM=s=>{if(!s)return '';const a=s.split(':').map(Number);let h=a[0];const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(a[1]||0)+' '+ap};
const plural=(n,w,ws)=>n+' '+(n===1?w:(ws||w+'s'));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  back:S('<path d="M15 5l-7 7 7 7"/>'),

/* ============ storage (local first - permanent schema versioning) ============ */
// PERMANENT CONSTANT: Do not change KEY in future updates. This guarantees user data persistence.
const KEY='sadhanapada.v1';
let storageOK=true, db=null, saveT=null;
const blank=()=>({v:1,created:new Date().toISOString(),params:[],days:{},weeks:{},notes:{},meta:{lastExport:null,dirty:false,seen:{},lastDismissedBackup:null,dismissedWelcomeBackup:false}});
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const o=JSON.parse(raw);
      o.params=Array.isArray(o.params)?o.params:[];
      o.days=(o.days&&typeof o.days==='object')?o.days:{};
      o.weeks=(o.weeks&&typeof o.weeks==='object')?o.weeks:{};
      o.notes=(o.notes&&typeof o.notes==='object')?o.notes:{};
      o.meta=Object.assign({lastExport:null,dirty:false,seen:{},lastDismissedBackup:null,dismissedWelcomeBackup:false},o.meta||{});
      return o;
    }
  }catch(e){storageOK=false}
  return blank();
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(e){storageOK=false}}
function touch(){db.meta.dirty=true;clearTimeout(saveT);saveT=setTimeout(persist,250)}
function flush(){clearTimeout(saveT);persist()}
const nowISO=()=>new Date().toISOString();
const dayOf=(k,make)=>{let d=db.days[k];if(!d&&make)d=db.days[k]={t:{},a:{},n:null,u:null};return d};
function hasData(k){
  const d=db.days[k];if(!d)return false;
  return Object.keys(d.t||{}).length>0||Object.values(d.a||{}).some(x=>x&&x.t&&x.t.trim())||!!(d.n&&d.n.t&&d.n.t.trim());
}
function cleanup(k){if(db.days[k]&&!hasData(k))delete db.days[k]}
function setT(k,pid,val){
  const d=dayOf(k,true);d.t=d.t||{};
  if(val===null||val===undefined)delete d.t[pid];else d.t[pid]=val;
  d.u=nowISO();cleanup(k);touch();
}
function setAns(scope,key,qid,text){
  let rec;
  if(scope==='d')rec=dayOf(key,true);else rec=db.weeks[key]=db.weeks[key]||{a:{},u:null};
  rec.a=rec.a||{};const prev=rec.a[qid];
  if(!text.trim())delete rec.a[qid];
  else if(!prev||prev.t!==text)rec.a[qid]={t:text,at:nowISO()};
  rec.u=nowISO();
  if(scope==='d')cleanup(key);else if(!Object.keys(rec.a).length)delete db.weeks[key];
  touch();
}
function setNote(k,text){
  const d=dayOf(k,true);
  d.n=text.trim()?{t:text,at:nowISO()}:null;
  d.u=nowISO();cleanup(k);touch();
}
function setPersonalNote(k,text){
  db.notes=db.notes||{};
  if(!text.trim())delete db.notes[k];
  else{const prev=db.notes[k];if(!prev||prev.t!==text)db.notes[k]={t:text,at:nowISO()};}
  touch();
}
const P=id=>db.params.find(p=>p.id===id);
const liveParams=()=>db.params.filter(p=>!p.archived);
const answeredD=(k,q)=>{const a=(db.days[k]||{}).a||{};const ok=x=>a[x.id]&&a[x.id].t&&a[x.id].t.trim();return q.subs?q.subs.some(ok):!!ok(q)};

const Insights={list:[],register(fn){this.list.push(fn)}};
const STOP=new Set(('about above after again also always among another because been before being between both cannot could didn does doing done down during each either even ever every from further have having here however into just like made make many might more most much must myself only other over please really said same should since some still such than that their them then there these they this those through today under until very want was were what when where whether which while will with within without would your yours yourself feel felt feeling days time times getting'
).split(' '));

function periodOf(kind,start){
  if(kind==='w'){return {kind,start,end:addD(start,6),ps:addD(start,-7),pe:addD(start,-1)}}
  const pe=addD(start,-1);
  return {kind,start,end:monEnd(start),ps:monStart(pe),pe};
}
function firstKey(){
  const a=Object.keys(db.days).filter(hasData).sort()[0],b=Object.keys(db.weeks).sort()[0];
  return [a,b].filter(Boolean).sort()[0]||null;
}
function ctxFor(kind,start){
  const P0=periodOf(kind,start),t=today(),f=firstKey()||t;
  const clip=(a,b)=>{const s=a<f?f:a,e=b>t?t:b;return s>e?[]:range(s,e)};
  const keys=clip(P0.start,P0.end),pKeys=clip(P0.ps,P0.pe);
  const both=keys.concat(pKeys);
  const params=db.params.filter(p=>!p.archived||both.some(k=>db.days[k]&&db.days[k].t&&db.days[k].t[p.id]!==undefined));
  return {P:P0,kind,keys,pKeys,active:keys.filter(hasData),pActive:pKeys.filter(hasData),params};
}
function score(p,v){
  switch(p.type){
    case 'check':case 'star':return v?1:0;
    case 'mood':return {h:1,n:.5,s:0}[v];
    case 'rating':return (v-1)/4;
    case 'symbol':return p.sym&&p.sym[v]?p.sym[v].s:undefined;
  }
}
function pstats(p,keys){
  const rec=[],dist={};
  keys=p.c?keys.filter(k=>k>=p.c||(((db.days[k]||{}).t||{})[p.id]!==undefined)):keys;
  keys.forEach(k=>{
    const v=((db.days[k]||{}).t||{})[p.id];
    if(p.type==='check'||p.type==='star'){rec.push({k,v:v?1:0,s:v?1:0});return}
    if(v===undefined||v===null)return;
    const s=p.type==='count'?v:score(p,v);
    if(s===undefined||s===null)return;
    rec.push({k,v,s});dist[v]=(dist[v]||0)+1;
  });
  const n=rec.length;
  return {rec,n,dist,days:keys.length,mean:n?avg(rec.map(x=>x.s)):null,sum:(p.type==='check'||p.type==='star'||p.type==='count')?rec.reduce((a,x)=>a+x.v,0):0};
}
function levelText(p,m){
  switch(p.type){
    case 'rating':return (1+4*m).toFixed(1)+' of 5';
    case 'mood':return (1+2*m).toFixed(1)+' of 3';
    case 'count':return m.toFixed(1)+(p.unit?' '+p.unit:'');
    default:return Math.round(m*100)+'%';
  }
}
function deltaText(p,b,a){
  const d=a-b,sg=d>0?'+':d<0?'−':'';
  switch(p.type){
    case 'rating':return sg+Math.abs(d*4).toFixed(1);
    case 'mood':return sg+Math.abs(d*2).toFixed(1);
    case 'count':return sg+Math.abs(d).toFixed(1);
    default:return sg+Math.abs(Math.round(d*100))+' pts';
  }
}
function describe(p,st){
  const n=st.n,days=st.days;
  switch(p.type){
    case 'check':return 'was ticked on '+st.sum+' of '+days+' recorded days ('+Math.round(st.mean*100)+'%).';
    case 'star':return 'earned a star on '+st.sum+' of '+days+' recorded days ('+Math.round(st.mean*100)+'%).';
    case 'mood':return 'was happy on '+(st.dist.h||0)+', normal on '+(st.dist.n||0)+' and sad on '+(st.dist.s||0)+' of '+n+' recorded days.';
    case 'rating':return 'averaged '+(1+4*st.mean).toFixed(1)+' out of 5 across '+plural(n,'day')+'.';
    case 'symbol':return 'was recorded as '+(p.sym||[]).map((o,i)=>st.dist[i]?(o.l||o.g||'')+' ('+st.dist[i]+')':null).filter(Boolean).join(', ')+' across '+plural(n,'day')+'.';
    case 'count':return 'averaged '+st.mean.toFixed(1)+(p.unit?' '+p.unit:'')+' per recorded day across '+plural(n,'day')+'.';
  }
  return '';
}

/* --- analyzer: tracker parameters --- */
Insights.register(function trackerAnalyzer(c){
  const out=[],per=c.kind==='w'?'week':'month',prevLab=c.kind==='w'?'last week':'last month';
  c.params.forEach(p=>{
    const cur=pstats(p,c.active);if(!cur.n)return;
    const prv=pstats(p,c.pActive),isC=p.type==='count',name=p.name;
    let streakHit=false;
    if(p.type==='check'||p.type==='star'){
      let s=0;for(let i=cur.rec.length-1;i>=0&&cur.rec[i].s===0;i--)s++;
      if(s>=3){streakHit=true;out.push({b:'wrong',w:1.5+s/10,n:name,t:'was not '+(p.type==='check'?'ticked':'starred')+' on the last '+s+' recorded days ('+cur.sum+' of '+cur.days+' in total).'})}
    }
    if(!isC&&cur.days>=3){
      if(cur.mean>=.7&&cur.n>=3)out.push({b:'well',w:1+cur.mean,n:name,t:describe(p,cur)});
      else if(cur.mean<=.4&&!streakHit)out.push({b:'wrong',w:2-cur.mean,n:name,t:describe(p,cur)});
    }
    if(!isC&&p.type!=='check'&&p.type!=='star'&&cur.days>=4&&cur.n/cur.days<.5)
      out.push({b:'wrong',w:1.2,n:name,t:'was recorded on only '+cur.n+' of '+cur.days+' recorded days.'});
    let before=null,after=null,basis='';
    if(prv.n>=2&&c.pActive.length>=3&&cur.n>=2){before=prv.mean;after=cur.mean;basis='compared with '+prevLab}
    else if(cur.n>=4){const h=Math.floor(cur.n/2);before=avg(cur.rec.slice(0,h).map(x=>x.s));after=avg(cur.rec.slice(h).map(x=>x.s));basis='between the first and second half of this '+per}
    if(before!==null){
      const delta=after-before;let better=null;
      if(isC){if(p.dir==='more'||p.dir==='less'){const th=Math.max(.5,.2*Math.abs(before));if(Math.abs(delta)>=th)better=(p.dir==='more')===(delta>0)}}
      else if(Math.abs(delta)>=.12)better=delta>0;
      if(better!==null)out.push({b:better?'improved':'declined',w:1+Math.abs(delta),n:name,t:(better?'improved':'declined')+' from '+levelText(p,before)+' to '+levelText(p,after)+', '+basis+'.'});
    }
  });
  return out;
});

/* --- analyzer: daily reflection (parameters) --- */
Insights.register(function reflectAnalyzer(c){
  const out=[],den=c.keys.length,pden=c.pKeys.length;

  else if(rate<=.4)out.push({b:'wrong',w:2-rate,n:'Daily reflection',t:'was answered on '+(cur===0?'none':'only '+cur)+' of '+den+' days.'});
  if(pden>=3){
    const d=rate-prv/pden;
    if(d>=.2)out.push({b:'improved',w:1+d,n:'Daily reflection',t:'was answered on '+cur+' of '+den+' days, up from '+prv+' of '+pden+' in the previous '+(c.kind==='w'?'week':'month')+'.'});
    if(d<=-.2)out.push({b:'declined',w:1+Math.abs(d),n:'Daily reflection',t:'was answered on '+cur+' of '+den+' days, down from '+prv+' of '+pden+' in the previous '+(c.kind==='w'?'week':'month')+'.'});

  }
  return out;
});

/* --- analyzer: weekday pattern (monthly, needs enough days) --- */
Insights.register(function weekdayAnalyzer(c){
  if(c.kind!=='m'||c.active.length<14)return [];
  const ps=liveParams().filter(p=>p.type!=='count');if(!ps.length)return [];
  const by=[[],[],[],[],[],[],[]];

  const all=avg(rows.map(r=>r.m)),lo=rows.reduce((a,b)=>b.m<a.m?b:a),hi=rows.reduce((a,b)=>b.m>a.m?b:a);

    {b:'wrong',w:1,pl:1,n:DAY[lo.i]+'s',t:'were your lowest days, averaging '+Math.round(lo.m*100)+'% against '+Math.round(all*100)+'% overall.'}

});

/* --- themes from your own words (counts only, no interpretation) --- */
function words(texts){
  const m=new Map();
  texts.forEach(t=>{(t.toLowerCase().match(/[\p{L}\p{M}']+/gu)||[]).forEach(w=>{
    w=w.replace(/^'+|'+$/g,'');if(w.length<4||STOP.has(w))return;m.set(w,(m.get(w)||0)+1)})});
  return m;
}
function textsOf(keys){const o=[];keys.forEach(k=>{const d=db.days[k];if(d&&d.a)Object.values(d.a).forEach(x=>x&&x.t&&o.push(x.t))});return o}
function weekTexts(a,b){const o=[];Object.keys(db.weeks).forEach(w=>{if(w>=a&&w<=b)Object.values(db.weeks[w].a||{}).forEach(x=>x&&x.t&&o.push(x.t))});return o}
function themesFor(c){
  const cur=words(textsOf(c.keys).concat(weekTexts(c.P.start,c.P.end)));
  const pt=textsOf(c.pKeys).concat(weekTexts(c.P.ps,c.P.pe)),prv=words(pt);
  return Array.from(cur.entries()).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,10)
    .map(e=>{const pv=prv.get(e[0])||0;return {w:e[0],n:e[1],prev:pv,rising:pt.length>0&&e[1]>=3&&e[1]>=2*pv&&e[1]-pv>=2}});
}
function numbersFor(c){
  return c.params.map(p=>{
    const cur=pstats(p,c.active);if(!cur.n)return null;
    const prv=pstats(p,c.pActive);
    let now;
    switch(p.type){
      case 'check':case 'star':now=cur.sum+' of '+cur.days+' days';break;
      case 'count':now=levelText(p,cur.mean)+' avg, total '+cur.sum;break;
      default:now=levelText(p,cur.mean)+' avg'}
    let before='–',chg='',cls='';
    if(prv.n>=2){
      before=levelText(p,prv.mean);
      const d=cur.mean-prv.mean;
      if(Math.abs(d)>=(p.type==='count'?.05:.02)){
        chg=(d>0?'▲ ':'▼ ')+deltaText(p,prv.mean,cur.mean);
        if(p.type==='count'){if(p.dir==='more')cls=d>0?'up':'dn';else if(p.dir==='less')cls=d<0?'up':'dn'}
        else cls=d>0?'up':'dn';
      }else chg='steady';
    }
    return {name:p.name,now,before,chg,cls};
  }).filter(Boolean);
}
function computeReview(kind,start){
  const c=ctxFor(kind,start);
  const out={well:[],improved:[],declined:[],wrong:[],focus:[]};
  const enough=c.active.length>=2;
  if(enough)Insights.list.forEach(fn=>{try{(fn(c)||[]).forEach(f=>out[f.b].push(f))}catch(e){console.error(e)}});
  ['well','improved','declined','wrong'].forEach(b=>out[b].sort((a,z)=>(z.w||0)-(a.w||0)));
  const seen={},wellNames=new Set(out.well.map(f=>f.n));
  out.wrong.concat(out.declined.filter(f=>!wellNames.has(f.n))).sort((a,z)=>(z.w||0)-(a.w||0)).forEach(f=>{
    if(out.focus.length<3&&!seen[f.n]){seen[f.n]=1;out.focus.push({n:f.n,t:f.t,pl:f.pl})}});
  if(enough&&c.active.length<c.keys.length/2)
    out.focus.push({n:'Recording',t:'Only '+c.active.length+' of '+c.keys.length+' days have any entry, so patterns above are based on limited data.',rec:1});
  return {kind,start,end:c.P.end,c,out,enough,numbers:enough?numbersFor(c):[],themes:enough?themesFor(c):[]};

const REVIEW_AT=[21,30];
function reviewReady(end){const t=pk(end);t.setHours(REVIEW_AT[0],REVIEW_AT[1],0,0);return new Date()>=t}
function reviewStarts(kind){
  const keys=Object.keys(db.days).filter(hasData).sort(),wk=Object.keys(db.weeks).sort();
  const cand=[keys[0],wk[0]].filter(Boolean).sort();
  if(!cand.length)return [];
  const first=cand[0],cur=today(),out=[];
  if(kind==='w'){for(let s=wkStart(first);s<=wkStart(cur);s=addD(s,7))out.push(s)}
  else{for(let s=monStart(first);s<=monStart(cur);s=addM(s,1))out.push(s)}
  return out.reverse();
}
const reviewTitle=(kind,start)=>kind==='w'?fmtRange(start,addD(start,6)):MON[pk(start).getMonth()]+' '+pk(start).getFullYear();
function unseenReview(){
  for(const kind of ['w','m']){
    for(const s of reviewStarts(kind)){
      const end=periodOf(kind,s).end;
      if(!reviewReady(end))continue;
      if(db.meta.seen[kind+':'+s])break;
      if(ctxFor(kind,s).active.length>=2)return {kind,start:s};
      break;
    }
  }
  return null;
}

/* ============ TXT journal (one file, always the full record) ============ */
const RULE='═'.repeat(46),RULE2='─'.repeat(46);
const ind=(t,p)=>t.split('\n').map(l=>p+l).join('\n');
function plainVal(p,v){
  if(v===undefined||v===null)return '-';
  switch(p.type){
    case 'check':return v?'Done':'-';
    case 'star':return v?'Starred':'-';
    case 'mood':return MOODL[v]||'-';
    case 'rating':return v+' / 5';
    case 'symbol':{const o=(p.sym||[])[v];return o?(o.l&&o.g?o.g+' '+o.l:(o.l||o.g||'-')):'-'}
    case 'count':return v+(p.unit?' '+p.unit:'');
  }
  return '-';
}
const dots=(a,b)=>a+' '+'.'.repeat(Math.max(3,34-a.length))+' '+b;
function dayText(k){
  const d=db.days[k],D=pk(k),L=[];
  L.push(RULE,DAY[D.getDay()].toUpperCase()+', '+D.getDate()+' '+MON[D.getMonth()].toUpperCase()+' '+D.getFullYear(),RULE);
  const ps=db.params.filter(p=>!p.archived||(d.t||{})[p.id]!==undefined);
  if(ps.length&&Object.keys(d.t||{}).length){
    L.push('TRACKER');
    ps.forEach(p=>L.push('  '+dots(p.name+(p.time?' ('+fmtHM(p.time)+')':''),plainVal(p,(d.t||{})[p.id]))));
  }
  if(d.n&&d.n.t&&d.n.t.trim()){L.push('','NOTES  (saved '+fmtT(d.n.at)+')',ind(d.n.t,'  '))}
  const ans=DQF.filter(q=>d.a&&d.a[q.id]&&d.a[q.id].t.trim());
  if(ans.length){
    L.push('','DAILY PARAMETERS');
    ans.forEach(q=>{const a=d.a[q.id];L.push('  '+q.num+'. '+q.q+'  (saved '+fmtT(a.at)+')',ind(a.t,'     '))});
  }
  return L.join('\n');
}
function weekText(w){
  const r=db.weeks[w],L=[RULE2,'WEEKLY PARAMETERS  '+fmtRange(w,addD(w,6))+' '+pk(addD(w,6)).getFullYear(),RULE2];
  const got=q=>r.a&&r.a[q.id]&&r.a[q.id].t.trim();
  WQF.filter(got).forEach(q=>L.push('  '+q.num+'. '+q.q+'  (saved '+fmtT(r.a[q.id].at)+')',ind(r.a[q.id].t,'     ')));
  const sv=SQF.filter(got);
  if(sv.length){L.push('','  SEVA');sv.forEach(q=>L.push('  '+q.n+'. '+q.q+'  (saved '+fmtT(r.a[q.id].at)+')',ind(r.a[q.id].t,'     ')))}
  return L.join('\n');
}
function reviewText(rv){
  const L=[RULE2,(rv.kind==='w'?'WEEKLY':'MONTHLY')+' REVIEW  '+reviewTitle(rv.kind,rv.start),RULE2];
  L.push('Days with entries: '+rv.c.active.length+' of '+rv.c.keys.length);
  const sec=(label,arr,fn)=>{L.push('',label);if(!arr.length)L.push('  - Nothing to report from the recorded data.');else arr.forEach(f=>L.push('  - '+fn(f)))};
  const line=f=>f.n+' '+f.t;
  sec('Going well',rv.out.well,line);sec('Improved',rv.out.improved,line);sec('Declined',rv.out.declined,line);sec('What appears to be going wrong',rv.out.wrong,line);
  sec('Focus next',rv.out.focus,f=>f.rec?f.t:'Give '+f.n+' your attention: '+(f.pl?'they ':'it ')+f.t);
  L.push('','(Generated only from your recorded entries.)');
  return L.join('\n');
}
function buildTXT(){
  const blocks=[];
  Object.keys(db.days).filter(hasData).forEach(k=>blocks.push([k+'a',dayText(k)]));
  Object.keys(db.weeks).forEach(w=>{if(Object.values(db.weeks[w].a||{}).some(x=>x&&x.t&&x.t.trim()))blocks.push([addD(w,6)+'b',weekText(w)])});
  ['w','m'].forEach(kind=>reviewStarts(kind).forEach(s=>{
    const end=periodOf(kind,s).end;
    if(!reviewReady(end))return;
    const rv=computeReview(kind,s);
    if(rv.enough)blocks.push([end+(kind==='w'?'c':'d'),reviewText(rv)]);
  }));
  blocks.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
  const nDays=Object.keys(db.days).filter(hasData).length;
  const head=[RULE,'SADHANAPADA JOURNAL',RULE,
    'One continuous record. Each day is added below the previous one,',
    'newest at the bottom. Keep saving over this same file.',
    '',
    'Started:       '+fmtFull(dkey(new Date(db.created))),
    'Last updated:  '+fmtDT(nowISO()),
    'Days recorded: '+nDays];
  const payload={v:1,created:db.created,params:db.params,days:db.days,weeks:db.weeks};
  const foot=[RULE,'END OF ENTRIES',RULE,'',
    'RESTORE DATA. Do not edit the line below. The app reads it to bring',
    'everything back if you reinstall or move to a new phone.',
    'SADHANAPADA-DATA v1 '+JSON.stringify(payload)];
  return head.join('\n')+'\n\n'+blocks.map(b=>b[1]).join('\n\n')+(blocks.length?'\n\n':'')+foot.join('\n')+'\n';
}
function importText(text){
  const line=text.split(/\r?\n/).reverse().find(l=>l.indexOf('SADHANAPADA-DATA')>=0);
  if(!line)throw new Error('No restore data found in this text.');
  const jsonStart=line.indexOf('{');
  if(jsonStart<0)throw new Error('Restore data format is invalid.');
  const o=JSON.parse(line.slice(jsonStart));
  if(!o||typeof o!=='object'||typeof o.days!=='object')throw new Error('The restore data looks damaged.');
  let nd=0,nw=0,np=0;
  (o.params||[]).forEach(p=>{if(p&&p.id&&p.name&&!P(p.id)){db.params.push(p);np++}});
  Object.keys(o.days||{}).forEach(k=>{
    const inc=o.days[k];if(!inc||typeof inc!=='object'||!/^\d{4}-\d\d-\d\d$/.test(k))return;
    inc.t=inc.t||{};inc.a=inc.a||{};
    const cur=db.days[k];
    if(!cur||(inc.u||'')>(cur.u||'')){db.days[k]=inc;nd++}
  });
  Object.keys(o.weeks||{}).forEach(k=>{
    const inc=o.weeks[k];if(!inc||typeof inc!=='object'||!/^\d{4}-\d\d-\d\d$/.test(k))return;
    inc.a=inc.a||{};
    const cur=db.weeks[k];
    if(!cur||(inc.u||'')>(cur.u||'')){db.weeks[k]=inc;nw++}
  });
  if(o.created&&o.created<db.created)db.created=o.created;
  touch();flush();
  return {nd,nw,np};
}

function buildNotesTXT(){
  const notesObj=db.notes||{};
  const keys=Object.keys(notesObj).filter(k=>notesObj[k]&&notesObj[k].t&&notesObj[k].t.trim()).sort();
  const RULE='═'.repeat(46);
  const head=[RULE,'SADHANAPADA PERSONAL NOTES & DIARY',RULE,

    'Each entry is saved date-wise in chronological order.',
    '',
    'Started:       '+fmtFull(dkey(new Date(db.created))),
    'Last updated:  '+fmtDT(nowISO()),
    'Total entries: '+keys.length];
  const blocks=keys.map(k=>{
    const n=notesObj[k],D=pk(k);
    const dateHeader=DAY[D.getDay()].toUpperCase()+', '+D.getDate()+' '+MON[D.getMonth()].toUpperCase()+' '+D.getFullYear();
    return RULE+'\n'+dateHeader+'  (saved '+fmtT(n.at)+')\n'+RULE+'\n'+n.t;
  });
  const payload={v:1,created:db.created,notes:notesObj};
  const foot=[RULE,'END OF NOTES',RULE,'',
    'RESTORE NOTES DATA. Do not edit the line below. The app reads it to bring back your notes.',
    'SADHANAPADA-NOTES-DATA v1 '+JSON.stringify(payload)];
  return head.join('\n')+'\n\n'+blocks.join('\n\n')+(blocks.length?'\n\n':'')+foot.join('\n')+'\n';
}

function importNotesText(text){
  const line=text.split(/\r?\n/).reverse().find(l=>l.indexOf('SADHANAPADA-NOTES-DATA')>=0);
  if(!line)throw new Error('No notes restore data found in this text.');
  const jsonStart=line.indexOf('{');
  if(jsonStart<0)throw new Error('Restore data format is invalid.');
  const o=JSON.parse(line.slice(jsonStart));
  if(!o||typeof o!=='object'||typeof o.notes!=='object')throw new Error('The notes restore data looks damaged.');
  let nn=0;

    const cur=db.notes[k];
    if(!cur||(inc.at||'')>(cur.at||'')){db.notes[k]=inc;nn++}

}

async function deliverNotes(txt){
  const name='Notes.txt';
  if(DL){
    try{await DL.save({filename:name,data:txt});return true}
    catch(e){
      if(e&&e.code==='declined')return false;
      if(e&&e.code==='rate_limited'){toast('Please wait a moment, then try again');return false}
    }
  }
  try{
    const f=new File([txt],name,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Notes.txt'});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  try{
    const u=URL.createObjectURL(new Blob([txt],{type:'text/plain'})),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;
  }catch(e){}
  toast('Saving a file is not available here. Use Copy instead.');return false;
}

function insertBullet(ta){
  if(!ta)return;
  const start=ta.selectionStart,end=ta.selectionEnd,val=ta.value;
  if(start===end){
    const lineStart=val.lastIndexOf('\n',start-1)+1;
    if(val.substring(lineStart,lineStart+2)==='• '){
      ta.value=val.substring(0,lineStart)+val.substring(lineStart+2);
      ta.selectionStart=ta.selectionEnd=Math.max(lineStart,start-2);
    }else{
      ta.value=val.substring(0,lineStart)+'• '+val.substring(lineStart);
      ta.selectionStart=ta.selectionEnd=start+2;
    }
  }else{
    const lines=val.substring(start,end).split('\n');
    const newLines=lines.map(l=>l.startsWith('• ')?l.substring(2):'• '+l).join('\n');
    ta.value=val.substring(0,start)+newLines+val.substring(end);
    ta.selectionStart=start;
    ta.selectionEnd=start+newLines.length;
  }
  ta.focus();
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}

function checkIsDarkTheme(){
  const dt = document.documentElement.getAttribute('data-theme');
  if (dt === 'dark') return true;
  if (dt === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function skySVG(){
  const n = new Date();
  const hr = n.getHours() + n.getMinutes() / 60;
  const day = hr >= 5.5 && hr < 18.5; // Sunrise ~ 5:30, Sunset ~ 18:30
  const isDark = checkIsDarkTheme();

  // Progress t in [0, 1] along the sky arc
  const t = day ? (hr - 5.5) / 13 : (hr >= 18.5 ? (hr - 18.5) / 11 : (hr + 5.5) / 11);
  const clampT = Math.max(0, Math.min(1, t));

  // Bezier curve coordinates across ViewBox 0 0 320 100
  const x0 = 30, y0 = 76;
  const x1 = 160, y1 = -10;
  const x2 = 290, y2 = 76;
  const cx = (1 - clampT) * (1 - clampT) * x0 + 2 * (1 - clampT) * clampT * x1 + clampT * clampT * x2;
  const cy = (1 - clampT) * (1 - clampT) * y0 + 2 * (1 - clampT) * clampT * y1 + clampT * clampT * y2;

  let bgStop0, bgStop1, bgOpacity0;
  let coreStop0, coreStop1, innerGlowCol, outerGlowCol, outerGlowOpacity;
  let bodyContent = '';

  if (day) {
    const isDawn = clampT < 0.2;
    const isSunset = clampT > 0.8;

    if (!isDark) { // DAY + LIGHT THEME
      if (isDawn) {
        bgStop0 = '#FFAB91'; bgStop1 = '#FFE0B2'; bgOpacity0 = 0.55;
        coreStop0 = '#FFF3E0'; coreStop1 = '#FF6F00';
        innerGlowCol = '#FF7043'; outerGlowCol = '#FFB74D'; outerGlowOpacity = 0.5;
      } else if (isSunset) {
        bgStop0 = '#FF8A65'; bgStop1 = '#D1C4E9'; bgOpacity0 = 0.60;
        coreStop0 = '#FFF8E1'; coreStop1 = '#E65100';
        innerGlowCol = '#FF5722'; outerGlowCol = '#FF9800'; outerGlowOpacity = 0.55;
      } else { // Midday
        bgStop0 = '#FFF8E1'; bgStop1 = '#FFE082'; bgOpacity0 = 0.45;
        coreStop0 = '#FFFFFF'; coreStop1 = '#FFA000';
        innerGlowCol = '#FFC107'; outerGlowCol = '#FFE082'; outerGlowOpacity = 0.45;
      }
    } else { // DAY + DARK THEME
      if (isDawn || isSunset) {
        bgStop0 = '#3E2723'; bgStop1 = '#261C18'; bgOpacity0 = 0.5;
        coreStop0 = '#FFE082'; coreStop1 = '#D84315';
        innerGlowCol = '#FF7043'; outerGlowCol = '#FF9800'; outerGlowOpacity = 0.35;
      } else { // Midday on Dark Theme
        bgStop0 = '#263238'; bgStop1 = '#1C272C'; bgOpacity0 = 0.45;
        coreStop0 = '#FFF9C4'; coreStop1 = '#FFB300';
        innerGlowCol = '#FFC107'; outerGlowCol = '#FFA000'; outerGlowOpacity = 0.3;
      }
    }

    bodyContent = `
      <g class="sun-group" transform="translate(${cx.toFixed(1)},${cy.toFixed(1)})">
        <!-- Outer volumetric corona -->
        <circle class="glow-outer" cx="0" cy="0" r="42" fill="url(#sunOuterGlow)"/>
        <!-- Inner blurred corona -->
        <circle class="glow-inner" cx="0" cy="0" r="22" fill="url(#sunInnerGlow)" filter="url(#glowBlur)"/>
        <!-- Sun Core Disc -->
        <circle cx="0" cy="0" r="10" fill="url(#sunCore)"/>
      </g>
    `;
  } else { // NIGHTTIME
    if (isDark) { // NIGHT + DARK THEME
      bgStop0 = '#101B2B'; bgStop1 = '#131A1B'; bgOpacity0 = 0.65;
      coreStop0 = '#ECEFF1'; coreStop1 = '#CFD8DC';
      innerGlowCol = '#B0BEC5'; outerGlowCol = '#90A4AE'; outerGlowOpacity = 0.35;
    } else { // NIGHT + LIGHT THEME
      bgStop0 = '#C5CAE9'; bgStop1 = '#E8EAF6'; bgOpacity0 = 0.45;
      coreStop0 = '#546E7A'; coreStop1 = '#37474F';
      innerGlowCol = '#78909C'; outerGlowCol = '#90A4AE'; outerGlowOpacity = 0.25;
    }

    // 10 Twinkling Stars scattered across upper sky
    const starColor = isDark ? 'rgba(236, 239, 241, 0.85)' : 'rgba(120, 144, 156, 0.55)';
    const stars = [
      {cx: 45, cy: 22, r: 1.1, cls: 'drift-1'}, {cx: 85, cy: 38, r: 0.8, cls: 'drift-2'}, {cx: 125, cy: 18, r: 1.3, cls: 'drift-3'},
      {cx: 175, cy: 32, r: 0.7, cls: 'drift-4'}, {cx: 215, cy: 15, r: 1.2, cls: 'drift-1'}, {cx: 255, cy: 42, r: 0.9, cls: 'drift-2'},
      {cx: 285, cy: 25, r: 1.0, cls: 'drift-3'}, {cx: 65, cy: 55, r: 0.7, cls: 'drift-4'}, {cx: 145, cy: 50, r: 0.9, cls: 'drift-1'}, {cx: 235, cy: 58, r: 0.8, cls: 'drift-2'}
    ];

    const starsHTML = stars.map((s, idx) =>
      `<circle class="star ${s.cls}" cx="${s.cx}" cy="${s.cy}" r="${s.r}" fill="${starColor}"/>`
    ).join('');

    // Crescent Curve Path centered at (0,0)
    const crescentD = "M 7,-9 A 9,9 0 1,1 -5,7 A 7.5,7.5 0 0,0 7,-9 Z";

    bodyContent = `
      <g class="sky-stars">${starsHTML}</g>
      <g class="moon-group" transform="translate(${cx.toFixed(1)},${cy.toFixed(1)}) scale(1.05)">
        <!-- Outer lunar halo -->
        <circle class="glow-outer" cx="0" cy="0" r="34" fill="url(#moonOuterGlow)"/>
        <!-- Inner lunar aura -->
        <circle class="glow-inner" cx="0" cy="0" r="18" fill="url(#moonInnerGlow)" filter="url(#glowBlur)"/>
        <!-- Moon Crescent Disc -->
        <path class="moon-disc" d="${crescentD}" fill="url(#moonBody)"/>

  return `

          <stop offset="100%" stop-color="${bgStop1}" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="sunCore" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="${coreStop0}"/>
          <stop offset="100%" stop-color="${coreStop1}"/>
        </radialGradient>
        <radialGradient id="sunInnerGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="${innerGlowCol}" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="${innerGlowCol}" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sunOuterGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="${outerGlowCol}" stop-opacity="${outerGlowOpacity}"/>
          <stop offset="100%" stop-color="${outerGlowCol}" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="moonBody" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="${coreStop0}"/>
          <stop offset="100%" stop-color="${coreStop1}"/>
        </radialGradient>
        <radialGradient id="moonInnerGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="${innerGlowCol}" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="${innerGlowCol}" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="moonOuterGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="${outerGlowCol}" stop-opacity="${outerGlowOpacity}"/>
          <stop offset="100%" stop-color="${outerGlowCol}" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Ambient Sky Backdrop fading into page background -->
      <rect x="0" y="0" width="320" height="100" fill="url(#skyBgGrad)"/>

      <!-- Celestial Body (Sun/Moon & Stars) -->
      ${bodyContent}
    </svg>
  `;
}

  const words=text.trim().split(/\s+/).length;
  return words+' '+(words===1?'word':'words')+' • '+chars+' chars';
}

function pHistory(){
  const g=[];
  Object.keys(db.days).forEach(k=>{
    const d=db.days[k],items=DQF.filter(q=>d.a&&d.a[q.id]&&d.a[q.id].t.trim());
    if(items.length)g.push({kind:'d',k,sort:k+'a',items:items.map(q=>({q,a:d.a[q.id]}))});
  });
  Object.keys(db.weeks).forEach(w=>{
    const r=db.weeks[w],items=WQF.concat(SQF).filter(q=>r.a&&r.a[q.id]&&r.a[q.id].t.trim());
    if(items.length)g.push({kind:'w',k:w,sort:addD(w,6)+'b',items:items.map(q=>({q,a:r.a[q.id]}))});
  });
  g.sort((a,b)=>a.sort<b.sort?-1:1);
  let list=g.filter(x=>ui.hf==='all'||x.kind===(ui.hf==='daily'?'d':'w'));
  if(ui.hord==='new')list.reverse();
  const ctl='<div class="chips" style="padding:0 0 10px">'+[['all','All'],['daily','Daily'],['weekly','Weekly']].map(c=>'<button class="chip sm '+(ui.hf===c[0]?'on':'')+'" data-act="hf" data-v="'+c[0]+'">'+c[1]+'</button>').join('')+
    '<button class="chip sm" data-act="hord" style="margin-left:auto">'+(ui.hord==='old'?'Oldest first':'Newest first')+'</button></div>';
  if(!list.length)return ctl+'<div class="empty"><h2>No entries yet</h2><p>Your answers are saved here automatically, with the date and time.</p></div>';
  const rows=list.map(x=>{
    const last=x.items.reduce((m,i)=>i.a.at>m?i.a.at:m,'');
    const label=x.kind==='d'?DAYS[pk(x.k).getDay()]+' '+fmtFull(x.k):'Week of '+fmtRange(x.k,addD(x.k,6));
    return '<details class="hg"><summary><div class="hd"><b>'+esc(label)+(x.kind==='w'?'<span class="tag w">Weekly</span>':'')+'</b><small>'+plural(x.items.length,'answer')+', last saved '+esc(fmtDT(last))+'</small></div><span class="cv">'+IC.chev+'</span></summary><div class="hbody">'+
      x.items.map(i=>'<div class="ha"><div class="hq">'+esc(i.q.num+'. '+i.q.q)+'</div><div class="hx">'+esc(i.a.t)+'</div><div class="ht">Saved '+esc(fmtDT(i.a.at))+'</div></div>').join('')+
      '<div class="btns"><button class="btn sm" data-act="editEntry" data-kind="'+x.kind+'" data-k="'+x.k+'">Open to edit</button></div></div></details>';
  }).join('');
  return ctl+'<p class="muted small" style="margin-bottom:6px">'+plural(list.length,'entry','entries')+', '+(ui.hord==='old'?'oldest first':'newest first')+'</p>'+rows;
}

const REMINDERS=[
  {id:'daily',title:'Sadhanapada: Daily Reflection',label:'Daily reflection',desc:'Every day, 8:30 PM',details:'Time for your daily Sadhanapada reflection and parameter journaling.',hour:20,minute:30,durationMins:30,recur:'RRULE:FREQ=DAILY'},

  {id:'mreview',title:'Sadhanapada: Monthly Review',label:'Monthly review',desc:'Last day of month, 9:30 PM',details:'Your monthly Sadhanapada review is ready in the app.',hour:21,minute:30,durationMins:30,recur:'RRULE:FREQ=MONTHLY'}
];
function getReminderDates(rem,now=new Date()){
  let start=new Date(now);
  start.setSeconds(0);start.setMilliseconds(0);
  if(rem.id==='daily'){
    start.setHours(rem.hour,rem.minute,0,0);
    if(now>=start)start.setDate(start.getDate()+1);
  }else if(rem.id==='weekly'||rem.id==='wreview'){
    const day=now.getDay(),diff=(7-day)%7;
    start.setDate(now.getDate()+diff);
    start.setHours(rem.hour,rem.minute,0,0);
    if(diff===0&&now>=start)start.setDate(start.getDate()+7);
  }else if(rem.id==='mreview'){
    start=new Date(now.getFullYear(),now.getMonth()+1,0,rem.hour,rem.minute,0,0);
    if(now>=start)start=new Date(now.getFullYear(),now.getMonth()+2,0,rem.hour,rem.minute,0,0);
  }
  const end=new Date(start.getTime()+rem.durationMins*60*1000);
  const fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  return {start,end,startStr:fmt(start),endStr:fmt(end)};
}
function googleCalUrl(rem){
  const {startStr,endStr}=getReminderDates(rem);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(rem.title)+
    '&dates='+startStr+'/'+endStr+
    '&details='+encodeURIComponent(rem.details)+
    '&recur='+encodeURIComponent(rem.recur);
}
function buildICS(rems=REMINDERS){
  const now=new Date(),dtstamp=now.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sadhanapada//Reminders//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  rems.forEach(r=>{
    const {startStr,endStr}=getReminderDates(r,now);
    lines.push(
      'BEGIN:VEVENT',
      'UID:'+r.id+'-reminder@sadhanapada.app',
      'DTSTAMP:'+dtstamp,
      'SUMMARY:'+r.title,
      'DESCRIPTION:'+r.details,
      'DTSTART:'+startStr,
      'DTEND:'+endStr,
      r.recur,
      'BEGIN:VALARM',
      'TRIGGER:-PT0M',
      'ACTION:DISPLAY',
      'DESCRIPTION:'+r.title,
      'END:VALARM',
      'END:VEVENT'
    );
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
async function downloadICS(content,filename='sadhanapada-reminders.ics'){
  try{
    const blob=new Blob([content],{type:'text/calendar;charset=utf-8'});
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    return true;
  }catch(e){}
  return false;
}
function isIOSDevice(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function handleAddCal(remId, e){
  const rem = REMINDERS.find(r => r.id === remId);
  if(!rem) return;

  if(isIOSDevice()){
    if(e) e.preventDefault();
    const ics = buildICS([rem]);
    const blob = new Blob([ics], {type: 'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = rem.id + '-reminder.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Opening Apple Calendar... Tap Add/Save to confirm');
  } else {
    toast('Opening Calendar... Tap Save to confirm');
  }
}

    guidedAudio.addEventListener('pause',()=>{
      updateGuidedUI();
      relWakeLock();
    });

    guidedAudio.addEventListener('timeupdate',()=>{
      updateGuidedUIProgress();
      updateMediaSessionPosition();
    });

    guidedAudio.addEventListener('ended',()=>{
      updateGuidedUI();
      relWakeLock();
    });

    guidedAudio.addEventListener('loadedmetadata',()=>{
      updateGuidedUI();
    });

    guidedAudio.addEventListener('error',(e)=>{
      console.error("Audio playback error",e);
      toast("Could not load audio. Please check Guided_Yogasanas.mp3.");
      updateGuidedUI();
    });
  }
  return guidedAudio;
}

function setupMediaSession(){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:'Guided Yogasanas',
      artist:'Sadhanapada',
      album:'Sadhguru Gurukulam',
      artwork:[
        {src:'icon-192.png',sizes:'192x192',type:'image/png'},
        {src:'icon-512.png',sizes:'512x512',type:'image/png'}
      ]
    });

    navigator.mediaSession.setActionHandler('play',()=>{
      const a=getGuidedAudio();
      a.play().catch(()=>{});
    });
    navigator.mediaSession.setActionHandler('pause',()=>{
      const a=getGuidedAudio();
      a.pause();
    });
    navigator.mediaSession.setActionHandler('seekbackward',(details)=>{
      const a=getGuidedAudio();
      const skip=details.seekOffset||10;
      a.currentTime=Math.max(0,a.currentTime-skip);
    });
    navigator.mediaSession.setActionHandler('seekforward',(details)=>{
      const a=getGuidedAudio();
      const skip=details.seekOffset||10;
      a.currentTime=Math.min(a.duration||0,a.currentTime+skip);
    });
    navigator.mediaSession.setActionHandler('seekto',(details)=>{
      const a=getGuidedAudio();
      if(details.seekTime!=null&&!isNaN(details.seekTime)){
        a.currentTime=details.seekTime;
      }
    });
    navigator.mediaSession.setActionHandler('stop',()=>{
      const a=getGuidedAudio();
      a.pause();
      a.currentTime=0;
    });
  }catch(e){}
}

function updateMediaSessionPosition(){
  if(!('mediaSession' in navigator)||!navigator.mediaSession.setPositionState)return;
  const a=getGuidedAudio();
  if(a&&a.duration&&!isNaN(a.duration)&&isFinite(a.duration)){
    try{
      navigator.mediaSession.setPositionState({
        duration:a.duration,
        playbackRate:a.playbackRate||1,
        position:Math.min(a.currentTime,a.duration)
      });
    }catch(e){}
  }
}

function fmtSecs(s){
  if(isNaN(s)||s===null||!isFinite(s))return '0:00';
  const m=Math.floor(s/60);
  const sec=Math.floor(s%60);
  return m+':'+pad(sec);
}

function updateGuidedUIProgress(){
  const seekEl=document.getElementById('guided-seek');
  const curEl=document.getElementById('guided-cur');
  const a=guidedAudio;
  if(!a)return;

  if(curEl)curEl.textContent=fmtSecs(a.currentTime);
  if(seekEl&&a.duration&&!isNaN(a.duration)&&a.duration>0){
    if(!seekEl.dataset.dragging){
      seekEl.value=Math.floor((a.currentTime/a.duration)*100);
    }
  }
}

function updateGuidedUI(){
  if(ui.route!=='guided')return;
  const btnPlay=document.getElementById('guided-btn-play');
  const durEl=document.getElementById('guided-dur');
  const statusEl=document.getElementById('guided-status');
  const speedBtn=document.getElementById('guided-speed-btn');
  const a=guidedAudio;

  if(btnPlay){
    if(a&&!a.paused&&!a.ended){
      btnPlay.innerHTML=IC.pause;
      btnPlay.setAttribute('aria-label','Pause Guided Yogasanas');
    }else{
      btnPlay.innerHTML=IC.play;
      btnPlay.setAttribute('aria-label','Play Guided Yogasanas');
    }
  }

  if(durEl&&a&&a.duration&&!isNaN(a.duration)&&isFinite(a.duration)){
    durEl.textContent=fmtSecs(a.duration);
  }

  if(speedBtn&&a){
    speedBtn.textContent=(a.playbackRate||1)+'x';
  }

  if(statusEl){
    if(a&&!a.paused&&!a.ended){
      statusEl.textContent='Playing (continues in background when screen is off)';
      statusEl.style.color='var(--hi)';
    }else if(a&&a.ended){
      statusEl.textContent='Completed';
      statusEl.style.color='var(--ink3)';
    }else if(a&&a.currentTime>0){
      statusEl.textContent='Paused';
      statusEl.style.color='var(--amber)';
    }else{
      statusEl.textContent='Ready to play';
      statusEl.style.color='var(--ink3)';
    }
  }

  updateGuidedUIProgress();
}

async function toggleGuidedPlay(){
  const a=getGuidedAudio();
  if(a.paused||a.ended){
    try{
      await a.play();
    }catch(err){
      console.error("Play failed:",err);
      toast("Tap play again to start audio.");
    }
  }else{
    a.pause();
  }
  updateGuidedUI();
}

function skipGuidedSecs(n){
  const a=getGuidedAudio();
  a.currentTime=Math.max(0,Math.min(a.duration||0,a.currentTime+n));
  updateGuidedUIProgress();
}

function seekGuidedTo(percent){
  const a=getGuidedAudio();
  if(a&&a.duration&&!isNaN(a.duration)&&a.duration>0){
    a.currentTime=(percent/100)*a.duration;
    updateGuidedUIProgress();
  }
}

async function deliver(txt){
  const name='Parameters.txt';
  if(DL){
    try{await DL.save({filename:name,data:txt});return true}
    catch(e){
      if(e&&e.code==='declined')return false;
      if(e&&e.code==='rate_limited'){toast('Please wait a moment, then try again');return false}
    }
  }
  try{
    const f=new File([txt],name,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Parameters.txt'});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  try{
    const u=URL.createObjectURL(new Blob([txt],{type:'text/plain'})),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;
  }catch(e){}
  toast('Saving a file is not available here. Use Copy instead.');return false;
}
