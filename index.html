<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sadhanapada</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EBEEE9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEEE9; --paper:#F6F7F3; --ink:#212A2C; --ink2:#4F5B5C; --ink3:#77838A; --line:#D0D7D0; --line2:#DFE4DD; --fill:#E1E6DF;
  --bark:#98826E; --lichen:#7B9382; --stone:#6B8593; --dusk:#8C7C9B; --amber:#C4913F;
  --t-bark:rgba(152,130,110,.13); --t-lichen:rgba(123,147,130,.15); --t-stone:rgba(107,133,147,.14); --t-dusk:rgba(140,124,155,.14); --t-amber:rgba(196,145,63,.15);
  --hi:#5E8A6C; --mid:#A98B3B; --lo:#8A7A9E; --warn:#A5605A;
  --ease:cubic-bezier(.22,.7,.2,1);
  --serif:'Marcellus',Georgia,'Times New Roman',serif;
  --sans:'Mulish',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131A1B; --paper:#1A2223; --ink:#E7EBE6; --ink2:#AAB5B2; --ink3:#7E8B89; --line:#2C3637; --line2:#243030; --fill:#222C2D;
    --bark:#B79F89; --lichen:#95AE9C; --stone:#8AA5B4; --dusk:#AC9DBA; --amber:#DBA657;
    --t-bark:rgba(183,159,137,.14); --t-lichen:rgba(149,174,156,.15); --t-stone:rgba(138,165,180,.15); --t-dusk:rgba(172,157,186,.15); --t-amber:rgba(219,166,87,.15);
    --hi:#8DBD9B; --mid:#D6B667; --lo:#B3A3C7; --warn:#D08A83;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A1B; --paper:#1A2223; --ink:#E7EBE6; --ink2:#AAB5B2; --ink3:#7E8B89; --line:#2C3637; --line2:#243030; --fill:#222C2D;
  --bark:#B79F89; --lichen:#95AE9C; --stone:#8AA5B4; --dusk:#AC9DBA; --amber:#DBA657;
  --t-bark:rgba(183,159,137,.14); --t-lichen:rgba(149,174,156,.15); --t-stone:rgba(138,165,180,.15); --t-dusk:rgba(172,157,186,.15); --t-amber:rgba(219,166,87,.15);
  --hi:#8DBD9B; --mid:#D6B667; --lo:#B3A3C7; --warn:#D08A83;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
.ic svg,.ib svg,.mk svg,.tog svg,.opt svg,.ric svg,.sbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--stone);outline-offset:2px}

/* ---------- hero ---------- */
#hero{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;opacity:1;transition:opacity .8s ease;pointer-events:auto}
#hero.out{opacity:0;pointer-events:none}
#hero .hw{font:400 clamp(34px,9vw,52px)/1.2 var(--serif);letter-spacing:.01em;color:var(--ink);opacity:0;transform:translateY(6px);transition:opacity .6s ease,transform .8s var(--ease);text-align:center}
#hero.in .hw{opacity:1;transform:none}
#hero .hw span{display:inline-block;margin-left:.15em}

/* ---------- layout ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh}
#view.enter{animation:vin .22s ease both}
@keyframes vin{from{opacity:0}to{opacity:1}}
.pg{padding:0 20px 90px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 12px 8px}
.top-in{display:flex;align-items:center;gap:6px;min-height:44px}
.top h1{font:400 24px/1.2 var(--serif);flex:1;letter-spacing:.005em}
.top-r{display:flex;gap:2px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink2)}
.ib:active{background:var(--fill)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 8px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink2);padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sm{padding:5px 11px;font-size:13px}

.seg{display:flex;background:var(--fill);border-radius:999px;padding:4px;margin:8px 0 14px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

.dnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px}
.dnav .dl{text-align:center}
.dnav .dl b{display:block;font:400 22px/1.2 var(--serif)}
.dnav .dl small{color:var(--ink3);font-size:13px}
.dnav button:disabled{opacity:.25}

.sv{font-size:12px;color:var(--ink3);min-height:18px;padding:3px 2px 0}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:14.5px;color:var(--ink);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:13.5px}

/* ---------- home ---------- */
.home-top{padding:22px 20px 6px}
.sky{width:100%;height:auto;display:block;overflow:visible}
.sky .arc{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 5;stroke-linecap:round}
.sky .hz{stroke:var(--line);stroke-width:1.2}
.sky .sun{fill:var(--amber)}
.sky .moon{fill:var(--paper);stroke:var(--ink3);stroke-width:1.4}
.greet{margin-top:6px;color:var(--ink2);font-size:15px}
.home-top h1{font:400 clamp(30px,8vw,38px)/1.15 var(--serif);margin-top:2px;letter-spacing:.005em}
.rows{display:grid;gap:12px;margin:14px 0 18px}
.row{--a:var(--bark);--t:var(--t-bark);display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:15px 18px;border-radius:22px;border:1px solid var(--line2);background:var(--t);transition:transform .15s var(--ease)}
.row:active{transform:scale(.985)}
.ric{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--a);background:var(--paper);border:1px solid var(--line2)}
.rt{flex:1;min-width:0}
.rt b{display:block;font:400 20px/1.25 var(--serif);letter-spacing:.005em}
.rt small{display:block;color:var(--ink2);font-size:13.5px;line-height:1.35;margin-top:1px}
.row .chev{color:var(--ink3);width:18px;flex:none}
.row .chev svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.c-params{--a:var(--bark);--t:var(--t-bark)}
.c-track{--a:var(--lichen);--t:var(--t-lichen)}
.c-yoga{--a:var(--stone);--t:var(--t-stone)}
.c-shakti{--a:var(--dusk);--t:var(--t-dusk)}
.c-surya{--a:var(--amber);--t:var(--t-amber)}
.minor{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.minor .row{padding:12px 14px;border-radius:18px;background:transparent;border:1px solid var(--line);gap:12px}
.minor .ric{width:38px;height:38px}
.minor .rt b{font-size:17px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--paper);border:1px solid var(--line);margin:0 0 10px}
.banner p{flex:1;font-size:14px;line-height:1.4}
.banner p b{font-weight:700}
.banner.warn{border-color:var(--warn)}

/* ---------- questions ---------- */
.q{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:20px 0;border-bottom:1px solid var(--line2)}
.qb{min-width:0}
.qt,.qs2{overflow-wrap:anywhere}
.qn{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.qt{font:400 19px/1.35 var(--serif);display:block;letter-spacing:.005em}
.qs2{font:400 17px/1.4 var(--serif);display:block}
.qs2 i{font-style:normal;color:var(--ink3);margin-right:2px}
.qh{font-size:13.5px;line-height:1.5;color:var(--ink3);margin:5px 0 8px}
.fld{margin-top:10px}
.fld:first-child{margin-top:0}
textarea,input[type=text],input[type=time]{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:12px 14px;font:400 16px/1.5 var(--sans);color:var(--ink);resize:none;outline:none;display:block;margin-top:8px}
textarea:focus,input[type=text]:focus,input[type=time]:focus{border-color:var(--stone);box-shadow:0 0 0 3px var(--t-stone)}
textarea{min-height:52px}
::placeholder{color:var(--ink3);opacity:.8}
.subh{font:400 21px/1.3 var(--serif);margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line)}

/* ---------- history ---------- */
details.hg{border-bottom:1px solid var(--line2);padding:2px 0}
details.hg summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 2px;cursor:pointer}
details.hg summary::-webkit-details-marker{display:none}
details.hg summary .hd{flex:1}
details.hg summary b{display:block;font:400 18px/1.3 var(--serif)}
details.hg summary small{color:var(--ink3);font-size:13px}
details.hg summary .cv{transition:transform .2s;color:var(--ink3)}
details.hg[open] summary .cv{transform:rotate(90deg)}
.cv svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hbody{padding:0 2px 16px}
.ha{margin-top:12px}
.ha .hq{font-size:13.5px;color:var(--ink3);line-height:1.4}
.ha .hx{white-space:pre-wrap;margin-top:2px;line-height:1.5}
.ha .ht{font-size:12px;color:var(--ink3)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--t-bark);color:var(--ink2);margin-left:6px;vertical-align:2px}
.tag.w{background:var(--t-dusk)}

/* ---------- tracker: day ---------- */
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line2)}
.tl{min-width:0;flex:1}
.trow.stack{flex-direction:column;align-items:flex-start;gap:10px}
.trow.stack .ctl{width:100%}
.trow.stack .opts{justify-content:flex-start;flex-wrap:nowrap}
.trow.stack .opt{flex:1;max-width:60px}
.tn{font:400 18px/1.3 var(--serif);overflow-wrap:anywhere}
.tm{font-size:12.5px;color:var(--ink3)}
.ctl{flex:none}
.tog{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink3);display:grid;place-items:center;transition:background .15s,border-color .15s}
.tog:not(.on) svg{opacity:.3}
.tog.on{background:var(--hi);border-color:var(--hi);color:#fff}
.tog.star.on{background:transparent;border-color:var(--amber);color:var(--amber)}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.opt{min-width:44px;height:44px;padding:0 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink2);display:grid;place-items:center;font:700 15px var(--sans);transition:background .15s}
.opt.fill{background:var(--t-lichen);border-color:transparent}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.glyph{font-size:20px;line-height:1}
.step{display:flex;align-items:center;gap:6px}
.step b{min-width:38px;text-align:center;font:700 19px var(--sans)}
.step .opt{min-width:40px;height:40px}
.notes{margin-top:22px}
.notes>label{font:400 19px var(--serif)}
.empty{text-align:center;padding:36px 10px 10px}
.empty h2{font:400 22px/1.3 var(--serif);margin-bottom:6px}
.empty p{color:var(--ink2);font-size:14.5px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0}

/* ---------- tracker: week (paper) ---------- */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 8px 14px;margin:6px -8px 0}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 6px;margin-bottom:12px}
.p-title{font:400 27px/1 var(--serif)}
.p-range{font-size:13px;color:var(--ink2);text-align:right}
.p-range u{text-decoration:none;border-bottom:1px solid var(--ink3);padding:0 6px}
.pnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.g{display:grid;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.g>*{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:42px;min-width:0;display:flex;align-items:center;justify-content:center}
.g .gh{background:var(--fill);flex-direction:column;font-size:11.5px;line-height:1.15;color:var(--ink2);min-height:48px;padding:2px 0}
.g .gh b{font-size:13px;font-weight:700;color:var(--ink)}
.g button.gh{border-top:0;border-left:0;border-radius:0}
.g .gh.today b{background:var(--ink);color:var(--bg);border-radius:50%;min-width:22px;height:22px;display:grid;place-items:center}
.g .gh.lab{font:400 15px var(--serif);color:var(--ink)}
.g .gn{justify-content:flex-start;padding:4px 8px;text-align:left;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.g .gt{font-size:11.5px;color:var(--ink3);flex-direction:column;line-height:1.2;text-align:center}
.cell{background:transparent;padding:0;border-top:0;border-left:0;border-radius:0;color:inherit}
.cell:active{background:var(--fill)}
.cell.fut{opacity:.35;pointer-events:none}
.cell.sel{background:var(--t-lichen)}
.mk{display:inline-grid;place-items:center;color:var(--ink2)}
.mk svg{width:19px;height:19px}
.mk.hi{color:var(--hi)}.mk.mid{color:var(--mid)}.mk.lo{color:var(--lo)}.mk.amber{color:var(--amber)}
.mk.num{font:700 14px var(--sans)}
.wnotes{margin-top:14px;padding:0 6px}
.wnotes .wt{font:400 17px var(--serif)}
.wn{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px;color:var(--ink2);line-height:1.4}
.wn b{color:var(--ink);font-weight:700;margin-right:6px}
.wl{height:30px;border-bottom:1px solid var(--line)}
.hint{font-size:13px;color:var(--ink3);margin-top:12px;text-align:center}

/* ---------- tracker: month ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;margin-top:12px}
.cal .wd{text-align:center;font-size:12px;color:var(--ink3);font-weight:600}
.cd{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;color:inherit}
.cd[disabled]{opacity:.3}
.ring{--p:0deg;width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--lichen) 0 var(--p),var(--line2) 0);position:relative;display:grid;place-items:center}
.ring::before{content:'';position:absolute;inset:3.5px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;font-size:14px}
.cd.today .ring span{font-weight:800}
.cd.sel .ring::before{background:var(--fill)}
.dot{width:4px;height:4px;border-radius:50%;background:var(--bark);opacity:0}
.dot.on{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--ink3);margin-top:16px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lichen);margin-right:6px}
.legend i.b{background:var(--bark)}
.stat{margin-top:18px;text-align:center;color:var(--ink2);font-size:14.5px}

/* ---------- manage ---------- */
.mrow{display:flex;align-items:center;gap:6px;padding:12px 0;border-bottom:1px solid var(--line2)}
.mrow .mi{flex:1;min-width:0}
.mrow .mi b{display:block;font:400 18px/1.3 var(--serif);overflow-wrap:anywhere}
.mrow .mi small{color:var(--ink3);font-size:13px}
.mrow .ib{width:38px;height:38px}
.mrow .ib svg{width:19px;height:19px}
.lab{font:700 13px var(--sans);color:var(--ink2);margin:16px 0 4px;display:block}
.types{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sopts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper)}
.sopt.on{border-color:var(--ink)}
.sopt .pv{display:flex;gap:8px;color:var(--ink2)}
.sopt .pv .mk svg,.sopt .pv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sopt .pv .glyph{font-size:18px}

/* ---------- sheet & toast ---------- */
.sheet{position:fixed;inset:0;z-index:60;pointer-events:none;visibility:hidden}
.sheet.open{pointer-events:auto;visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(18,24,25,.42);opacity:0;transition:opacity .25s}
.sheet.open .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(104%);transition:transform .3s var(--ease);max-height:90%;overflow:auto;box-shadow:0 -1px 0 var(--line)}
.sheet.open .panel{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.panel h2{font:400 23px/1.25 var(--serif)}
.panel .sub{color:var(--ink3);font-size:13.5px;margin-top:2px}
.panel .ctl-big{margin:20px 0 6px;display:flex;justify-content:center}
.panel .ctl-big .opts{justify-content:center}
.panel .ctl-big .opt{min-width:52px;height:52px}
.panel .ctl-big .step .opt{min-width:48px;height:48px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s var(--ease);z-index:80;pointer-events:none;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- practice pages ---------- */
.search{position:relative;margin:4px 0 6px}
.search input{margin:0;padding-left:42px;border-radius:999px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;fill:none;stroke:var(--ink3);stroke-width:1.6;stroke-linecap:round}
.psec{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px);padding-top:26px}
.psec>h2{font:400 24px/1.25 var(--serif);margin-bottom:6px}
.psec>.psub{color:var(--ink3);font-size:13.5px;margin-bottom:8px}
.ph{font:700 13.5px var(--sans);color:var(--ink2);margin:16px 0 6px}
.pp{margin:8px 0;color:var(--ink2);line-height:1.6}
.pnote{margin:10px 0;padding:12px 14px;border-radius:14px;background:var(--t-amber);font-size:14.5px;line-height:1.55}

.tbl.num td:first-child{color:var(--ink3);font-weight:700;width:30px}
.tbl tr.sepr td{background:var(--t-amber);color:var(--ink2);font-size:13.5px;text-align:center;padding:8px}

.stepsl li span:first-child{font-weight:700}

/* ---------- reviews ---------- */
.rlist{display:grid;gap:10px;margin:8px 0 18px}

<script>
'use strict';
/* ============ utilities ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pk=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(k,n)=>{const d=pk(k);d.setDate(d.getDate()+n);return dkey(d)};
const today=()=>dkey(new Date());
const wkStart=k=>{const d=pk(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)};
const diffD=(a,b)=>Math.round((pk(b)-pk(a))/864e5);
const range=(a,b)=>{const o=[];let k=a,g=0;while(k<=b&&g++<4000){o.push(k);k=addD(k,1)}return o};
const monStart=k=>k.slice(0,7)+'-01';
const monEnd=k=>{const d=pk(k);return dkey(new Date(d.getFullYear(),d.getMonth()+1,0))};
const addM=(k,n)=>{const d=pk(k);return dkey(new Date(d.getFullYear(),d.getMonth()+n,1))};
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONS=MON.map(m=>m.slice(0,3));
const DAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS=DAY.map(d=>d.slice(0,3));
const fmtLong=k=>{const d=pk(k),y=d.getFullYear()===new Date().getFullYear();return DAY[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+(y?'':' '+d.getFullYear())};
const fmtShort=k=>{const d=pk(k);return d.getDate()+' '+MONS[d.getMonth()]};
const fmtFull=k=>{const d=pk(k);return d.getDate()+' '+MONS[d.getMonth()]+' '+d.getFullYear()};
const fmtRange=(a,b)=>{const x=pk(a),y=pk(b);const yr=y.getFullYear()!==new Date().getFullYear()?' '+y.getFullYear():'';return (x.getMonth()===y.getMonth()?x.getDate():x.getDate()+' '+MONS[x.getMonth()])+' – '+y.getDate()+' '+MONS[y.getMonth()]+yr};
const fmtT=iso=>{const d=new Date(iso);if(isNaN(d))return '';let h=d.getHours();const m=pad(d.getMinutes());const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+m+' '+ap};
const fmtDT=iso=>{const d=new Date(iso);return isNaN(d)?'':d.getDate()+' '+MONS[d.getMonth()]+' '+d.getFullYear()+', '+fmtT(iso)};
const fmtHM=s=>{if(!s)return '';const a=s.split(':').map(Number);let h=a[0];const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(a[1]||0)+' '+ap};
const plural=(n,w,ws)=>n+' '+(n===1?w:(ws||w+'s'));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ============ icons ============ */

  star:S('<path d="M12 4l2.5 5.2 5.7.8-4.1 4 1 5.7L12 17l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/>'),

  face_n:S('<circle cx="12" cy="12" r="8.5"/><path d="M9 15h6"/>'+EYES),
  face_s:S('<circle cx="12" cy="12" r="8.5"/><path d="M8.5 16.4c1-1.7 2.2-2.4 3.5-2.4s2.5.7 3.5 2.4"/>'+EYES),

  cloud:S('<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>'),
  drop:S('<path d="M12 4c3 4 5.500 6.800 5.500 9.800a5.500 5.500 0 0 1-11 0C6.500 10.800 9 8 12 4z"/>'),

  up:S('<path d="M12 19V6M6.500 11.500L12 6l5.500 5.500"/>'),
  down:S('<path d="M12 5v13M6.500 12.500L12 18l5.500-5.500"/>'),
  trash:S('<path d="M5 8h14M9.500 8V5.500h5V8M7 8l1 11h8l1-11"/>'),
  edit:S('<path d="M5 19l1-4L16 5l3 3L9 18z"/>'),
  copy:S('<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h1"/>'),
  eye:S('<path d="M2.500 12S6 6 12 6s9.500 6 9.500 6-3.500 6-9.500 6-9.500-6-9.500-6z"/><circle cx="12" cy="12" r="2.500"/>'),
  upload:S('<path d="M12 16V5M7.500 9.500L12 5l4.500 4.500M5 19.500h14"/>'),
  bell:S('<path d="M6 16.500V11a6 6 0 0 1 12 0v5.500l1.500 1.500h-15zM10 20.500a2 2 0 0 0 4 0"/>'),
  search:S('<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>')
};

/* ============ questions (from the Parameters PDF) ============ */
const DQ=[
  {id:'d1',n:'1',s:'Inner Engineering practice',q:'How many times a day am I doing the Inner Engineering Crash Course?'},
  {id:'d2',n:'2',s:'Conscious eating',q:'Am I eating more consciously?',h:'Am I aware of the number of times I am chewing, the texture of the food, the quantity I am consuming? Am I eating with gratitude, keeping aside likes and dislikes?'},
  {id:'d3',n:'3',s:'Reacting or responding',q:'Am I reacting or responding to situations and people around me?',h:'How many times am I getting angry, impatient, irritated or annoyed? When I get angry or irritated, how many times am I seeing that all I experience is my making?'},
  {id:'d4',n:'4',s:'Becoming more willing',q:'Am I becoming more willing?',subs:[
    {id:'d4a',n:'a',s:'First reaction to instructions',q:'When I receive instructions of any kind, what is my first feeling or thought?'},
    {id:'d4b',n:'b',s:'Offering despite body and mind',q:'In spite of whatever is happening in my body or mind, am I able to keep myself aside, at least for a few moments, and do whatever is needed with a sense of offering?'},
    {id:'d4c',n:'c',s:'Same when unobserved',q:'If someone was watching me, would I do things in the same way or differently?',h:'For example, if someone reminds me to keep my phone aside at night, I will. Otherwise I will not.'}]},
  {id:'d5',n:'5',s:'Vibrant or dull',q:'Is my system more vibrant or dull?',h:'Am I feeling energetic all day? How easy or not? Am I finding it easy to wake up in the morning?'},
  {id:'d6',n:'6',s:'Vak Shuddhi',q:'How well am I able to maintain Vak Shuddhi?',h:'Am I moving towards using fewer words when I speak? Am I conscious of the words I am choosing to use and with what intention? Am I able to maintain silence after 9:30 pm?'},
  {id:'d7',n:'7',s:'Focus',q:'Am I able to stay more focused on whatever I am doing throughout the day?',h:'Is that focus starting to become more effortless, or do I have to remind myself to stay focused?'}
];
const WQ=[
  {id:'w1',n:'1',s:'Experience of Sadhana',q:'How is my experience of Sadhana?',h:'Am I able to sit still with more ease, for longer periods of time? Stronger? More still? When doing Hatha yoga or Kriya? During or after Pradakshina?'},
  {id:'w2',n:'2',s:'Bhakti Sadhana',q:'Am I able to make Bhakti Sadhana a part of my life?',subs:[
    {id:'w2a',n:'a',s:'Seeing something higher',q:'At least a few times a day, am I able to see something or someone as higher than myself?'},
    {id:'w2b',n:'b',s:'Seeing the best in people',q:'Am I seeing the best in people?'}]},
  {id:'w3',n:'3',s:'Commitment to growth',q:'Is my commitment towards my growth unwavering?',h:'Even on days when I am feeling unwell, am I able to use the situation for my growth?'},
  {id:'w4',n:'4',s:'Joy and love',q:'Irrespective of the situation, am I experiencing an effortless sense of joy and love?',h:'Am I smiling naturally?'},
  {id:'w5',n:'5',s:'Part of the problem or the solution',q:'How often am I part of the problem, and how often am I part of the solution?'},
  {id:'w6',n:'6',s:'Balance and stillness',q:'Am I feeling more balance and stillness within, irrespective of how my body and mind are, or how situations around me are?'}
];
const SQ=[
  {id:'s1',n:'1',s:'Seva intensity',q:'What is my current level of intensity in seva?'},
  {id:'s2',n:'2',s:'What holds me back in seva',q:'What is holding me back from being more intense in seva?'},
  {id:'s3',n:'3',s:'How to enhance seva',q:'What can I do to enhance my intensity?'}
];
const flatQ=list=>{const o=[];list.forEach(q=>{if(q.subs)q.subs.forEach(s=>o.push(Object.assign({},s,{num:q.n+s.n,parent:q.q})));else o.push(Object.assign({},q,{num:q.n}))});return o};
const DQF=flatQ(DQ), WQF=flatQ(WQ), SQF=SQ.map(q=>Object.assign({},q,{num:'Seva '+q.n}));
const QBYID={};DQF.concat(WQF,SQF).forEach(q=>QBYID[q.id]=q);

/* ============ tracker definitions ============ */
const TYPES={check:'Tick',mood:'Mood',star:'Star',rating:'Rating',symbol:'Symbols',count:'Count'};
const TYPEDESC={check:'Done or not done',mood:'Happy, normal or sad',star:'Award a star',rating:'A score from 1 to 5',symbol:'Choose your own symbols',count:'A number, like times or minutes'};
const MOODL={h:'Happy',n:'Normal',s:'Sad'};
const SYMSETS={
  circles:{name:'Full, half, empty',opts:[{i:'cFull',l:'Fully',s:1},{i:'cHalf',l:'Partly',s:.5},{i:'cEmpty',l:'Not yet',s:0}]},
  weather:{name:'Sun, cloud, rain',opts:[{i:'sun',l:'Sunny',s:1},{i:'cloud',l:'Cloudy',s:.5},{i:'drop',l:'Rainy',s:0}]},
  yesno:{name:'Yes, maybe, no',opts:[{i:'check',l:'Yes',s:1},{i:'tilde',l:'Maybe',s:.5},{i:'x',l:'No',s:0}]}
};
const SUGGEST=[
  {name:'Meditation',type:'check'},
  {name:'Kriya',type:'star'},
  {name:'Mood',type:'mood'},

  {name:'Practice',type:'symbol',set:'circles'},

];
const lvl=s=>s>=.75?'hi':s>=.35?'mid':'lo';
const symHTML=o=>o.i&&IC[o.i]?IC[o.i]:'<span class="glyph">'+esc(o.g||'')+'</span>';
const mark=(p,v)=>{
  if(v===undefined||v===null)return '';
  switch(p.type){
    case 'check':return v?'<span class="mk hi">'+IC.check+'</span>':'';
    case 'star':return v?'<span class="mk amber">'+IC.starF+'</span>':'';
    case 'mood':return '<span class="mk '+(v==='h'?'hi':v==='n'?'mid':'lo')+'">'+IC['face_'+v]+'</span>';
    case 'rating':return '<span class="mk num '+lvl((v-1)/4)+'">'+v+'</span>';
    case 'symbol':{const o=(p.sym||[])[v];return o?'<span class="mk '+lvl(o.s)+'">'+symHTML(o)+'</span>':''}
    case 'count':return '<span class="mk num">'+v+'</span>';
  }
  return '';
};

/* ============ storage (local first) ============ */
const KEY='sadhanapada.v1';
let storageOK=true, db=null, saveT=null;
const blank=()=>({v:1,created:new Date().toISOString(),params:[],days:{},weeks:{},meta:{lastExport:null,dirty:false,seen:{}}});
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const o=JSON.parse(raw);o.params=o.params||[];o.days=o.days||{};o.weeks=o.weeks||{};o.meta=Object.assign({lastExport:null,dirty:false,seen:{}},o.meta||{});return o}
  }catch(e){storageOK=false}
  return blank();
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(e){storageOK=false}}
function touch(){db.meta.dirty=true;clearTimeout(saveT);saveT=setTimeout(persist,250)}
function flush(){clearTimeout(saveT);persist()}
const nowISO=()=>new Date().toISOString();
const dayOf=(k,make)=>{let d=db.days[k];if(!d&&make)d=db.days[k]={t:{},a:{},n:null,u:null};return d};
function hasData(k){
  const d=db.days[k];if(!d)return false;
  return Object.keys(d.t||{}).length>0||Object.values(d.a||{}).some(x=>x&&x.t&&x.t.trim())||!!(d.n&&d.n.t&&d.n.t.trim());
}
function cleanup(k){if(db.days[k]&&!hasData(k))delete db.days[k]}
function setT(k,pid,val){
  const d=dayOf(k,true);d.t=d.t||{};
  if(val===null||val===undefined)delete d.t[pid];else d.t[pid]=val;
  d.u=nowISO();cleanup(k);touch();
}
function setAns(scope,key,qid,text){
  let rec;
  if(scope==='d')rec=dayOf(key,true);else rec=db.weeks[key]=db.weeks[key]||{a:{},u:null};
  rec.a=rec.a||{};const prev=rec.a[qid];
  if(!text.trim())delete rec.a[qid];
  else if(!prev||prev.t!==text)rec.a[qid]={t:text,at:nowISO()};
  rec.u=nowISO();
  if(scope==='d')cleanup(key);else if(!Object.keys(rec.a).length)delete db.weeks[key];
  touch();
}
function setNote(k,text){
  const d=dayOf(k,true);
  d.n=text.trim()?{t:text,at:nowISO()}:null;
  d.u=nowISO();cleanup(k);touch();
}

function periodOf(kind,start){
  if(kind==='w'){return {kind,start,end:addD(start,6),ps:addD(start,-7),pe:addD(start,-1)}}
  const pe=addD(start,-1);
  return {kind,start,end:monEnd(start),ps:monStart(pe),pe};
}
function firstKey(){
  const a=Object.keys(db.days).filter(hasData).sort()[0],b=Object.keys(db.weeks).sort()[0];
  return [a,b].filter(Boolean).sort()[0]||null;
}
function ctxFor(kind,start){
  const P0=periodOf(kind,start),t=today(),f=firstKey()||t;
  const clip=(a,b)=>{const s=a<f?f:a,e=b>t?t:b;return s>e?[]:range(s,e)};
  const keys=clip(P0.start,P0.end),pKeys=clip(P0.ps,P0.pe);
  const both=keys.concat(pKeys);
  const params=db.params.filter(p=>!p.archived||both.some(k=>db.days[k]&&db.days[k].t&&db.days[k].t[p.id]!==undefined));
  return {P:P0,kind,keys,pKeys,active:keys.filter(hasData),pActive:pKeys.filter(hasData),params};
}
function score(p,v){
  switch(p.type){
    case 'check':case 'star':return v?1:0;
    case 'mood':return {h:1,n:.5,s:0}[v];
    case 'rating':return (v-1)/4;
    case 'symbol':return p.sym&&p.sym[v]?p.sym[v].s:undefined;
  }
}
function pstats(p,keys){
  const rec=[],dist={};
  keys=p.c?keys.filter(k=>k>=p.c||(((db.days[k]||{}).t||{})[p.id]!==undefined)):keys;
  keys.forEach(k=>{
    const v=((db.days[k]||{}).t||{})[p.id];
    if(p.type==='check'||p.type==='star'){rec.push({k,v:v?1:0,s:v?1:0});return}
    if(v===undefined||v===null)return;
    const s=p.type==='count'?v:score(p,v);
    if(s===undefined||s===null)return;
    rec.push({k,v,s});dist[v]=(dist[v]||0)+1;
  });
  const n=rec.length;
  return {rec,n,dist,days:keys.length,mean:n?avg(rec.map(x=>x.s)):null,sum:(p.type==='check'||p.type==='star'||p.type==='count')?rec.reduce((a,x)=>a+x.v,0):0};
}
function levelText(p,m){
  switch(p.type){
    case 'rating':return (1+4*m).toFixed(1)+' of 5';
    case 'mood':return (1+2*m).toFixed(1)+' of 3';
    case 'count':return m.toFixed(1)+(p.unit?' '+p.unit:'');
    default:return Math.round(m*100)+'%';
  }
}
function deltaText(p,b,a){
  const d=a-b,sg=d>0?'+':d<0?'−':'';
  switch(p.type){
    case 'rating':return sg+Math.abs(d*4).toFixed(1);
    case 'mood':return sg+Math.abs(d*2).toFixed(1);
    case 'count':return sg+Math.abs(d).toFixed(1);
    default:return sg+Math.abs(Math.round(d*100))+' pts';
  }
}
function describe(p,st){
  const n=st.n,days=st.days;
  switch(p.type){
    case 'check':return 'was ticked on '+st.sum+' of '+days+' recorded days ('+Math.round(st.mean*100)+'%).';
    case 'star':return 'earned a star on '+st.sum+' of '+days+' recorded days ('+Math.round(st.mean*100)+'%).';
    case 'mood':return 'was happy on '+(st.dist.h||0)+', normal on '+(st.dist.n||0)+' and sad on '+(st.dist.s||0)+' of '+n+' recorded days.';
    case 'rating':return 'averaged '+(1+4*st.mean).toFixed(1)+' out of 5 across '+plural(n,'day')+'.';
    case 'symbol':return 'was recorded as '+(p.sym||[]).map((o,i)=>st.dist[i]?(o.l||o.g||'')+' ('+st.dist[i]+')':null).filter(Boolean).join(', ')+' across '+plural(n,'day')+'.';
    case 'count':return 'averaged '+st.mean.toFixed(1)+(p.unit?' '+p.unit:'')+' per recorded day across '+plural(n,'day')+'.';
  }
  return '';
}

/* --- analyzer: tracker parameters --- */
Insights.register(function trackerAnalyzer(c){
  const out=[],per=c.kind==='w'?'week':'month',prevLab=c.kind==='w'?'last week':'last month';
  c.params.forEach(p=>{
    const cur=pstats(p,c.active);if(!cur.n)return;
    const prv=pstats(p,c.pActive),isC=p.type==='count',name=p.name;
    let streakHit=false;
    if(p.type==='check'||p.type==='star'){
      let s=0;for(let i=cur.rec.length-1;i>=0&&cur.rec[i].s===0;i--)s++;
      if(s>=3){streakHit=true;out.push({b:'wrong',w:1.5+s/10,n:name,t:'was not '+(p.type==='check'?'ticked':'starred')+' on the last '+s+' recorded days ('+cur.sum+' of '+cur.days+' in total).'})}
    }
    if(!isC&&cur.days>=3){
      if(cur.mean>=.7&&cur.n>=3)out.push({b:'well',w:1+cur.mean,n:name,t:describe(p,cur)});
      else if(cur.mean<=.4&&!streakHit)out.push({b:'wrong',w:2-cur.mean,n:name,t:describe(p,cur)});
    }
    if(!isC&&p.type!=='check'&&p.type!=='star'&&cur.days>=4&&cur.n/cur.days<.5)
      out.push({b:'wrong',w:1.2,n:name,t:'was recorded on only '+cur.n+' of '+cur.days+' recorded days.'});
    let before=null,after=null,basis='';
    if(prv.n>=2&&c.pActive.length>=3&&cur.n>=2){before=prv.mean;after=cur.mean;basis='compared with '+prevLab}
    else if(cur.n>=4){const h=Math.floor(cur.n/2);before=avg(cur.rec.slice(0,h).map(x=>x.s));after=avg(cur.rec.slice(h).map(x=>x.s));basis='between the first and second half of this '+per}
    if(before!==null){
      const delta=after-before;let better=null;
      if(isC){if(p.dir==='more'||p.dir==='less'){const th=Math.max(.5,.2*Math.abs(before));if(Math.abs(delta)>=th)better=(p.dir==='more')===(delta>0)}}
      else if(Math.abs(delta)>=.12)better=delta>0;
      if(better!==null)out.push({b:better?'improved':'declined',w:1+Math.abs(delta),n:name,t:(better?'improved':'declined')+' from '+levelText(p,before)+' to '+levelText(p,after)+', '+basis+'.'});
    }
  });
  return out;
});

/* --- analyzer: daily reflection (parameters) --- */
Insights.register(function reflectAnalyzer(c){
  const out=[],den=c.keys.length,pden=c.pKeys.length;
  if(den<3)return out;
  const ansDays=keys=>keys.filter(k=>DQ.some(q=>answeredD(k,q))).length;
  const cur=ansDays(c.keys),prv=ansDays(c.pKeys),rate=cur/den;
  if(rate>=.7)out.push({b:'well',w:1+rate,n:'Daily reflection',t:'was answered on '+cur+' of '+den+' days.'});
  else if(rate<=.4)out.push({b:'wrong',w:2-rate,n:'Daily reflection',t:'was answered on '+(cur===0?'none':'only '+cur)+' of '+den+' days.'});
  if(pden>=3){
    const d=rate-prv/pden;
    if(d>=.2)out.push({b:'improved',w:1+d,n:'Daily reflection',t:'was answered on '+cur+' of '+den+' days, up from '+prv+' of '+pden+' in the previous '+(c.kind==='w'?'week':'month')+'.'});
    if(d<=-.2)out.push({b:'declined',w:1+Math.abs(d),n:'Daily reflection',t:'was answered on '+cur+' of '+den+' days, down from '+prv+' of '+pden+' in the previous '+(c.kind==='w'?'week':'month')+'.'});
  }
  if(cur>=2){
    DQ.map(q=>({q,x:c.keys.filter(k=>answeredD(k,q)).length})).filter(r=>r.x/den<=.25).sort((a,b)=>a.x-b.x).slice(0,3)
      .forEach(r=>out.push({b:'wrong',w:1.1,n:r.q.s||('Question '+r.q.n),t:'was answered on '+(r.x===0?'none':'only '+r.x)+' of '+den+' days.'}));
  }
  return out;
});

/* --- analyzer: weekly reflection --- */
Insights.register(function weeklyAnalyzer(c){
  const out=[],t=today(),total=WQF.length+SQF.length;
  const cnt=w=>{const r=db.weeks[w];return r?Object.values(r.a||{}).filter(x=>x&&x.t&&x.t.trim()).length:0};
  if(c.kind==='w'){
    const n=cnt(c.P.start),done=c.P.end<t;
    if(n>=Math.ceil(total*.7))out.push({b:'well',w:1.5,n:'Weekly reflection',t:'was answered, '+n+' of '+total+' questions.'});
    else if(n===0&&done)out.push({b:'wrong',w:1.4,n:'Weekly reflection',t:'was not answered this week.'});

  }
  const mondays=range(c.P.start,c.P.end).filter(k=>pk(k).getDay()===1&&addD(k,6)<t);
  if(mondays.length>=2){
    const got=mondays.filter(w=>cnt(w)>0).length,r=got/mondays.length;
    if(r>=.7)out.push({b:'well',w:1.3,n:'Weekly reflection',t:'was answered for '+got+' of '+mondays.length+' weeks.'});
    else if(r<=.4)out.push({b:'wrong',w:1.3,n:'Weekly reflection',t:'was answered for '+(got===0?'none':'only '+got)+' of '+mondays.length+' weeks.'});
  }
  return out;
});

/* --- analyzer: weekday pattern (monthly, needs enough days) --- */
Insights.register(function weekdayAnalyzer(c){
  if(c.kind!=='m'||c.active.length<14)return [];
  const ps=liveParams().filter(p=>p.type!=='count');if(!ps.length)return [];
  const by=[[],[],[],[],[],[],[]];
  c.active.forEach(k=>{
    const sc=[];
    ps.forEach(p=>{const v=((db.days[k]||{}).t||{})[p.id];
      if(p.type==='check'||p.type==='star')sc.push(v?1:0);
      else if(v!==undefined){const s=score(p,v);if(s!=null)sc.push(s)}});
    if(sc.length)by[pk(k).getDay()].push(avg(sc));
  });
  const rows=by.map((a,i)=>({i,n:a.length,m:avg(a)})).filter(r=>r.n>=2);
  if(rows.length<4)return [];
  const all=avg(rows.map(r=>r.m)),lo=rows.reduce((a,b)=>b.m<a.m?b:a),hi=rows.reduce((a,b)=>b.m>a.m?b:a);
  if(hi.m-lo.m<.2)return [];
  return [
    {b:'well',w:1,pl:1,n:DAY[hi.i]+'s',t:'were your strongest days, averaging '+Math.round(hi.m*100)+'% of the best score.'},
    {b:'wrong',w:1,pl:1,n:DAY[lo.i]+'s',t:'were your lowest days, averaging '+Math.round(lo.m*100)+'% against '+Math.round(all*100)+'% overall.'}
  ];
});

/* --- themes from your own words (counts only, no interpretation) --- */
function words(texts){
  const m=new Map();
  texts.forEach(t=>{(t.toLowerCase().match(/[\p{L}\p{M}']+/gu)||[]).forEach(w=>{
    w=w.replace(/^'+|'+$/g,'');if(w.length<4||STOP.has(w))return;m.set(w,(m.get(w)||0)+1)})});
  return m;
}
function textsOf(keys){const o=[];keys.forEach(k=>{const d=db.days[k];if(d&&d.a)Object.values(d.a).forEach(x=>x&&x.t&&o.push(x.t))});return o}
function weekTexts(a,b){const o=[];Object.keys(db.weeks).forEach(w=>{if(w>=a&&w<=b)Object.values(db.weeks[w].a||{}).forEach(x=>x&&x.t&&o.push(x.t))});return o}
function themesFor(c){
  const cur=words(textsOf(c.keys).concat(weekTexts(c.P.start,c.P.end)));
  const pt=textsOf(c.pKeys).concat(weekTexts(c.P.ps,c.P.pe)),prv=words(pt);
  return Array.from(cur.entries()).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,10)
    .map(e=>{const pv=prv.get(e[0])||0;return {w:e[0],n:e[1],prev:pv,rising:pt.length>0&&e[1]>=3&&e[1]>=2*pv&&e[1]-pv>=2}});
}
function numbersFor(c){
  return c.params.map(p=>{
    const cur=pstats(p,c.active);if(!cur.n)return null;
    const prv=pstats(p,c.pActive);
    let now;
    switch(p.type){
      case 'check':case 'star':now=cur.sum+' of '+cur.days+' days';break;
      case 'count':now=levelText(p,cur.mean)+' avg, total '+cur.sum;break;
      default:now=levelText(p,cur.mean)+' avg'}
    let before='–',chg='',cls='';
    if(prv.n>=2){
      before=levelText(p,prv.mean);
      const d=cur.mean-prv.mean;
      if(Math.abs(d)>=(p.type==='count'?.05:.02)){
        chg=(d>0?'▲ ':'▼ ')+deltaText(p,prv.mean,cur.mean);
        if(p.type==='count'){if(p.dir==='more')cls=d>0?'up':'dn';else if(p.dir==='less')cls=d<0?'up':'dn'}
        else cls=d>0?'up':'dn';
      }else chg='steady';
    }
    return {name:p.name,now,before,chg,cls};
  }).filter(Boolean);
}
function computeReview(kind,start){
  const c=ctxFor(kind,start);
  const out={well:[],improved:[],declined:[],wrong:[],focus:[]};
  const enough=c.active.length>=2;
  if(enough)Insights.list.forEach(fn=>{try{(fn(c)||[]).forEach(f=>out[f.b].push(f))}catch(e){console.error(e)}});
  ['well','improved','declined','wrong'].forEach(b=>out[b].sort((a,z)=>(z.w||0)-(a.w||0)));
  const seen={},wellNames=new Set(out.well.map(f=>f.n));
  out.wrong.concat(out.declined.filter(f=>!wellNames.has(f.n))).sort((a,z)=>(z.w||0)-(a.w||0)).forEach(f=>{
    if(out.focus.length<3&&!seen[f.n]){seen[f.n]=1;out.focus.push({n:f.n,t:f.t,pl:f.pl})}});
  if(enough&&c.active.length<c.keys.length/2)
    out.focus.push({n:'Recording',t:'Only '+c.active.length+' of '+c.keys.length+' days have any entry, so patterns above are based on limited data.',rec:1});
  return {kind,start,end:c.P.end,c,out,enough,numbers:enough?numbersFor(c):[],themes:enough?themesFor(c):[]};
}
const REVIEW_AT=[21,30];
function reviewReady(end){const t=pk(end);t.setHours(REVIEW_AT[0],REVIEW_AT[1],0,0);return new Date()>=t}
function reviewStarts(kind){
  const keys=Object.keys(db.days).filter(hasData).sort(),wk=Object.keys(db.weeks).sort();
  const cand=[keys[0],wk[0]].filter(Boolean).sort();
  if(!cand.length)return [];
  const first=cand[0],cur=today(),out=[];
  if(kind==='w'){for(let s=wkStart(first);s<=wkStart(cur);s=addD(s,7))out.push(s)}
  else{for(let s=monStart(first);s<=monStart(cur);s=addM(s,1))out.push(s)}
  return out.reverse();
}
const reviewTitle=(kind,start)=>kind==='w'?fmtRange(start,addD(start,6)):MON[pk(start).getMonth()]+' '+pk(start).getFullYear();
function unseenReview(){
  for(const kind of ['w','m']){
    for(const s of reviewStarts(kind)){
      const end=periodOf(kind,s).end;
      if(!reviewReady(end))continue;
      if(db.meta.seen[kind+':'+s])break;
      if(ctxFor(kind,s).active.length>=2)return {kind,start:s};
      break;
    }
  }
  return null;
}

/* ============ TXT journal (one file, always the full record) ============ */
const RULE='═'.repeat(46),RULE2='─'.repeat(46);
const ind=(t,p)=>t.split('\n').map(l=>p+l).join('\n');
function plainVal(p,v){
  if(v===undefined||v===null)return '-';
  switch(p.type){
    case 'check':return v?'Done':'-';
    case 'star':return v?'Starred':'-';
    case 'mood':return MOODL[v]||'-';
    case 'rating':return v+' / 5';
    case 'symbol':{const o=(p.sym||[])[v];return o?(o.l&&o.g?o.g+' '+o.l:(o.l||o.g||'-')):'-'}
    case 'count':return v+(p.unit?' '+p.unit:'');
  }
  return '-';
}
const dots=(a,b)=>a+' '+'.'.repeat(Math.max(3,34-a.length))+' '+b;
function dayText(k){
  const d=db.days[k],D=pk(k),L=[];
  L.push(RULE,DAY[D.getDay()].toUpperCase()+', '+D.getDate()+' '+MON[D.getMonth()].toUpperCase()+' '+D.getFullYear(),RULE);
  const ps=db.params.filter(p=>!p.archived||(d.t||{})[p.id]!==undefined);
  if(ps.length&&Object.keys(d.t||{}).length){
    L.push('TRACKER');
    ps.forEach(p=>L.push('  '+dots(p.name+(p.time?' ('+fmtHM(p.time)+')':''),plainVal(p,(d.t||{})[p.id]))));
  }
  if(d.n&&d.n.t&&d.n.t.trim()){L.push('','NOTES  (saved '+fmtT(d.n.at)+')',ind(d.n.t,'  '))}
  const ans=DQF.filter(q=>d.a&&d.a[q.id]&&d.a[q.id].t.trim());
  if(ans.length){
    L.push('','DAILY PARAMETERS');
    ans.forEach(q=>{const a=d.a[q.id];L.push('  '+q.num+'. '+q.q+'  (saved '+fmtT(a.at)+')',ind(a.t,'     '))});
  }
  return L.join('\n');
}
function weekText(w){
  const r=db.weeks[w],L=[RULE2,'WEEKLY PARAMETERS  '+fmtRange(w,addD(w,6))+' '+pk(addD(w,6)).getFullYear(),RULE2];
  const got=q=>r.a&&r.a[q.id]&&r.a[q.id].t.trim();
  WQF.filter(got).forEach(q=>L.push('  '+q.num+'. '+q.q+'  (saved '+fmtT(r.a[q.id].at)+')',ind(r.a[q.id].t,'     ')));
  const sv=SQF.filter(got);
  if(sv.length){L.push('','  SEVA');sv.forEach(q=>L.push('  '+q.n+'. '+q.q+'  (saved '+fmtT(r.a[q.id].at)+')',ind(r.a[q.id].t,'     ')))}
  return L.join('\n');
}
function reviewText(rv){
  const L=[RULE2,(rv.kind==='w'?'WEEKLY':'MONTHLY')+' REVIEW  '+reviewTitle(rv.kind,rv.start),RULE2];
  L.push('Days with entries: '+rv.c.active.length+' of '+rv.c.keys.length);
  const sec=(label,arr,fn)=>{L.push('',label);if(!arr.length)L.push('  - Nothing to report from the recorded data.');else arr.forEach(f=>L.push('  - '+fn(f)))};
  const line=f=>f.n+' '+f.t;
  sec('Going well',rv.out.well,line);sec('Improved',rv.out.improved,line);sec('Declined',rv.out.declined,line);sec('What appears to be going wrong',rv.out.wrong,line);
  sec('Focus next',rv.out.focus,f=>f.rec?f.t:'Give '+f.n+' your attention: '+(f.pl?'they ':'it ')+f.t);
  L.push('','(Generated only from your recorded entries.)');
  return L.join('\n');
}
function buildTXT(){
  const blocks=[];
  Object.keys(db.days).filter(hasData).forEach(k=>blocks.push([k+'a',dayText(k)]));
  Object.keys(db.weeks).forEach(w=>{if(Object.values(db.weeks[w].a||{}).some(x=>x&&x.t&&x.t.trim()))blocks.push([addD(w,6)+'b',weekText(w)])});
  ['w','m'].forEach(kind=>reviewStarts(kind).forEach(s=>{
    const end=periodOf(kind,s).end;
    if(!reviewReady(end))return;
    const rv=computeReview(kind,s);
    if(rv.enough)blocks.push([end+(kind==='w'?'c':'d'),reviewText(rv)]);
  }));
  blocks.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
  const nDays=Object.keys(db.days).filter(hasData).length;
  const head=[RULE,'SADHANAPADA JOURNAL',RULE,
    'One continuous record. Each day is added below the previous one,',
    'newest at the bottom. Keep saving over this same file.',
    '',
    'Started:       '+fmtFull(dkey(new Date(db.created))),
    'Last updated:  '+fmtDT(nowISO()),
    'Days recorded: '+nDays];
  const payload={v:1,created:db.created,params:db.params,days:db.days,weeks:db.weeks};
  const foot=[RULE,'END OF ENTRIES',RULE,'',
    'RESTORE DATA. Do not edit the line below. The app reads it to bring',
    'everything back if you reinstall or move to a new phone.',
    'SADHANAPADA-DATA v1 '+JSON.stringify(payload)];
  return head.join('\n')+'\n\n'+blocks.map(b=>b[1]).join('\n\n')+(blocks.length?'\n\n':'')+foot.join('\n')+'\n';
}
function importText(text){
  const line=text.split(/\r?\n/).reverse().find(l=>l.indexOf('SADHANAPADA-DATA')===0);
  if(!line)throw new Error('No restore data found in this text.');
  const o=JSON.parse(line.slice(line.indexOf('{')));
  if(!o||typeof o!=='object'||typeof o.days!=='object')throw new Error('The restore data looks damaged.');
  let nd=0,nw=0,np=0;
  (o.params||[]).forEach(p=>{if(p&&p.id&&p.name&&!P(p.id)){db.params.push(p);np++}});
  Object.keys(o.days).forEach(k=>{
    const inc=o.days[k];if(!inc||typeof inc!=='object'||!/^\d{4}-\d\d-\d\d$/.test(k))return;
    inc.t=inc.t||{};inc.a=inc.a||{};
    const cur=db.days[k];
    if(!cur||(inc.u||'')>(cur.u||'')){db.days[k]=inc;nd++}
  });
  Object.keys(o.weeks||{}).forEach(k=>{
    const inc=o.weeks[k];if(!inc||typeof inc!=='object'||!/^\d{4}-\d\d-\d\d$/.test(k))return;
    inc.a=inc.a||{};
    const cur=db.weeks[k];
    if(!cur||(inc.u||'')>(cur.u||'')){db.weeks[k]=inc;nw++}
  });
  if(o.created&&o.created<db.created)db.created=o.created;
  touch();flush();
  return {nd,nw,np};
}

      '<div class="btns"><button class="btn sm" data-act="editEntry" data-kind="'+x.kind+'" data-k="'+x.k+'">Open to edit</button></div></div></details>';
  }).join('');
  return ctl+'<p class="muted small" style="margin-bottom:6px">'+plural(list.length,'entry','entries')+', '+(ui.hord==='old'?'oldest first':'newest first')+'</p>'+rows;

function vReview(kind,start){
  const rv=computeReview(kind,start),end=rv.end,ready=reviewReady(end),per=kind==='w'?'week':'month',o=rv.out;
  if(ready&&!db.meta.seen[kind+':'+start]){db.meta.seen[kind+':'+start]=1;saveSoon()}
  const B=(cls,title,arr,fn)=>'<section class="rb b-'+cls+'"><h3><span class="dotc"></span>'+title+'</h3>'+(arr.length?'<ul>'+arr.map(f=>'<li>'+fn(f)+'</li>').join('')+'</ul>':'<div class="none">Nothing to report from your recorded data.</div>')+'</section>';
  const line=f=>'<b>'+esc(f.n)+'</b> '+esc(f.t);
  let h=hdr(kind==='w'?'Weekly review':'Monthly review',{back:'reviews'})+'<main class="pg rv"><h2 class="big">'+esc(reviewTitle(kind,start))+'</h2><p class="lead">'+plural(rv.c.active.length,'day')+' with entries out of '+rv.c.keys.length+(ready?'':'. This '+per+' is still in progress, so this is a preview.')+'</p>';
  if(!rv.enough)return h+'<div class="empty"><h2>Not enough to review yet</h2><p>Record at least two days in this '+per+' and patterns will appear here.</p></div></main>';
  h+=B('well','Going well',o.well,line)+B('improved','What has improved',o.improved,line)+B('declined','What has declined',o.declined,line)+B('wrong','What appears to be going wrong',o.wrong,line);
  h+=B('focus','Focus on next '+per,o.focus,f=>f.rec?esc(f.t):'Give <b>'+esc(f.n)+'</b> your attention: '+(f.pl?'they ':'it ')+esc(f.t));
  if(rv.numbers.length)h+='<section class="rb"><h3>The numbers</h3><table class="ntbl"><thead><tr><th>Tracker</th><th>This '+per+'</th><th>Before</th><th>Change</th></tr></thead><tbody>'+rv.numbers.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.now)+'</td><td>'+esc(r.before)+'</td><td class="'+r.cls+'">'+esc(r.chg)+'</td></tr>').join('')+'</tbody></table></section>';
  if(rv.themes.length)h+='<section class="rb"><h3>Words you used most</h3><p class="small muted">Simple counts from your written answers. Nothing is interpreted.</p><div class="words">'+rv.themes.map(t=>'<span>'+esc(t.w)+'<em>×'+t.n+(t.rising?', more than before':'')+'</em></span>').join('')+'</div></section>';
  h+='<p class="foot">Built only from your entries. Ratings are scored 1 to 5, moods 1 (sad) to 3 (happy) and symbols by their order, best to last. “Before” is the '+(kind==='w'?'previous week':'previous month')+'. Nothing here is inferred beyond what you recorded.</p></main>';
  return h;
}

/* ============ backup ============ */
function vBackup(){
  const nDays=Object.keys(db.days).filter(hasData).length;
  let nR=0;Object.keys(db.days).forEach(k=>{nR+=Object.values(db.days[k].a||{}).filter(x=>x&&x.t&&x.t.trim()).length});
  Object.keys(db.weeks).forEach(k=>{nR+=Object.values(db.weeks[k].a||{}).filter(x=>x&&x.t&&x.t.trim()).length});
  const last=db.meta.lastExport;
  const canShare=!!(navigator.canShare&&navigator.share&&(()=>{try{return navigator.canShare({files:[new File(['x'],'x.txt',{type:'text/plain'})]})}catch(e){return false}})());
  return hdr('Backup')+'<main class="pg">'+
    '<div class="card"><h3>Your journal</h3><div class="kv"><span>Days recorded</span><span>'+nDays+'</span></div><div class="kv"><span>Answers saved</span><span>'+nR+'</span></div><div class="kv"><span>Last saved to a file</span><span>'+(last?esc(fmtDT(last)):'Not yet')+'</span></div><div class="kv"><span>Changes since then</span><span>'+(db.meta.dirty?'Yes':'None')+'</span></div></div>'+
    '<p class="muted small" style="margin:12px 2px">Everything lives in one text file. Each day is added below the previous one, with the newest at the bottom. The file always has the same name, so save over the older copy and keep it somewhere safe, like Google Drive or Files. That copy stays with you even if the app is removed.</p>'+
    '<div class="btns"><button class="btn pri" data-act="saveTxt">'+IC.save+' Save journal file</button>'+(canShare?'<button class="btn" data-act="shareTxt">Share</button>':'')+'<button class="btn" data-go="journal">'+IC.eye+' Read it</button><button class="btn" data-act="copyTxt">'+IC.copy+' Copy</button></div>'+
    '<div class="card"><h3>Restore</h3><p>Bring everything back from a saved journal file, for example after reinstalling. Entries already here are kept, and the newer version of any day wins.</p><div class="btns"><button class="btn sm" data-act="pickFile">'+IC.upload+' Choose file</button><button class="btn sm" data-act="pasteRestore">Paste text</button></div></div>'+
    '<div class="card"><h3>Reminders</h3><div class="kv"><span>Daily reflection</span><span>Every day, 8:30 PM</span></div><div class="kv"><span>Weekly reflection</span><span>Sunday, 9:00 PM</span></div><div class="kv"><span>Weekly review</span><span>Sunday, 9:30 PM</span></div><div class="kv"><span>Monthly review</span><span>Last day, 9:30 PM</span></div><p style="margin-top:8px">A web app cannot wake itself in the background, so these alerts come from your phone’s Calendar. This screen only lists the times. When you open the app after a time has passed, a gentle prompt appears on Home.</p></div>'+
    '<div class="card"><h3>Where your data lives</h3><p>'+(storageOK?'Saved automatically on this device, in this browser only. Nothing is sent anywhere.':'This browser is blocking storage. Save your journal file often.')+'</p></div>'+
    '<p style="margin-top:22px"><button class="linkbtn" data-act="wipe">Erase everything on this device</button></p></main>';
}
function vJournal(){
  return hdr('Journal',{back:'backup'})+'<main class="pg"><pre class="jr">'+esc(buildTXT().replace(/^SADHANAPADA-DATA v1 .*$/m,'SADHANAPADA-DATA v1 {…restore data hidden in this preview…}'))+'</pre></main>';
}

/* ============ router ============ */
const parseHash=()=>{const h=(location.hash||'').replace(/^#\/?/,'');return h||'home'};
function render(anim){
  const parts=ui.route.split('/'),a=parts[0];let h;
  try{
    switch(a){
      case 'params':h=vParams();break;
      case 'tracker':h=parts[1]==='manage'?vManage():vTracker();break;
      case 'yoga':case 'shakti':case 'surya':h=vPractice(a);break;
      case 'reviews':h=vReviews();break;
      case 'review':h=(/^[wm]$/.test(parts[1]||'')&&/^\d{4}-\d\d-\d\d$/.test(parts[2]||''))?vReview(parts[1],parts[2]):vReviews();break;
      case 'backup':h=vBackup();break;
      case 'journal':h=vJournal();break;
      default:h=vHome();
    }
  }catch(e){console.error(e);h='<main class="pg"><p style="padding-top:40px">Something went wrong while showing this page.</p><div class="btns"><button class="btn" data-go="home">Back to Home</button></div></main>'}
  view.innerHTML=h;
  if(anim){view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter')}
  $$('textarea',view).forEach(autosize);
}
function go(r){
  closeSheet();
  if(r===ui.route){render();return}
  ui.route=r;
  try{if(location.hash!=='#/'+r)location.hash='/'+r}catch(e){}
  render(true);window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{const r=parseHash();if(r!==ui.route){ui.route=r;closeSheet();render(true);window.scrollTo(0,0)}});

/* ============ actions ============ */
const valOf=(k,pid)=>((db.days[k]||{}).t||{})[pid];
function moveParam(id,dir){
  const live=liveParams(),i=live.findIndex(p=>p.id===id),j=i+dir;
  if(i<0||j<0||j>=live.length)return;
  const a=db.params.indexOf(live[i]),b=db.params.indexOf(live[j]);
  const tmp=db.params[a];db.params[a]=db.params[b];db.params[b]=tmp;touch();render();
}
function addParam(o){
  const p={id:uid(),name:o.name,type:o.type,time:o.time||'',unit:o.unit||'',dir:o.dir||'more',archived:false,c:today()};
  if(o.type==='symbol')p.sym=o.sym||SYMSETS[o.set||'circles'].opts.map(x=>Object.assign({},x));
  db.params.push(p);touch();return p;
}
async function deliver(txt){
  const name='Sadhanapada-Journal.txt';
  if(DL){
    try{await DL.save({filename:name,data:txt});return true}
    catch(e){
      if(e&&e.code==='declined')return false;
      if(e&&e.code==='rate_limited'){toast('Please wait a moment, then try again');return false}
    }
  }
  try{
    const f=new File([txt],name,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sadhanapada journal'});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  try{
    const u=URL.createObjectURL(new Blob([txt],{type:'text/plain'})),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;
  }catch(e){}
  toast('Saving a file is not available here. Use Copy instead.');return false;
}
function markExported(){db.meta.lastExport=nowISO();db.meta.dirty=false;flush()}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}
}
function doImport(text){
  try{const r=importText(text);closeSheet();render();toast('Restored '+plural(r.nd,'day')+(r.nw?' and '+plural(r.nw,'weekly entry','weekly entries'):''))}
  catch(e){toast(e.message||'Could not restore from that')}
}

const ACT={
  ptab(a){ui.ptab=a.dataset.v;render()},
  pdate(a){const n=addD(ui.date,+a.dataset.d);if(n>today())return;ui.date=n;render()},
  pwk(a){const n=addD(ui.wk,7*a.dataset.d);if(n>wkStart(today()))return;ui.wk=n;render()},
  hf(a){ui.hf=a.dataset.v;render()},
  hord(){ui.hord=ui.hord==='old'?'new':'old';render()},
  editEntry(a){if(a.dataset.kind==='d'){ui.date=a.dataset.k;ui.ptab='daily'}else{ui.wk=a.dataset.k;ui.ptab='weekly'}render();window.scrollTo(0,0)},
  weeklyNow(){ui.ptab='weekly';ui.wk=wkStart(today());go('params')},
  ttab(a){ui.ttab=a.dataset.v;render()},
  tdate(a){const n=addD(ui.date,+a.dataset.d);if(n>today())return;ui.date=n;render()},
  twk(a){const n=addD(ui.tw,7*a.dataset.d);if(n>wkStart(today()))return;ui.tw=n;render()},
  tmon(a){const n=addM(ui.mon,+a.dataset.d);if(n>monStart(today()))return;ui.mon=n;render()},
  openDay(a){ui.date=a.dataset.k;ui.ttab='day';if(ui.route==='tracker'){render();window.scrollTo(0,0)}else go('tracker')},
  tog(a){const p=P(a.dataset.p),k=a.dataset.k;if(!p)return;setT(k,p.id,valOf(k,p.id)?null:true);render()},
  set(a){
    const p=P(a.dataset.p),k=a.dataset.k;if(!p)return;
    const v=p.type==='mood'?a.dataset.v:Number(a.dataset.v);
    setT(k,p.id,valOf(k,p.id)===v?null:v);
    if(ui.cell)closeSheet();
    render();
  },
  cnt(a){
    const p=P(a.dataset.p),k=a.dataset.k;if(!p)return;
    const cur=valOf(k,p.id),d=Number(a.dataset.d);
    setT(k,p.id,d>0?(cur===undefined?1:cur+1):(cur===undefined?0:Math.max(0,cur-1)));
    if(ui.cell)cellSheet(p.id,k);
    render();
  },
  clr(a){const p=P(a.dataset.p);if(!p)return;setT(a.dataset.k,p.id,null);closeSheet();render()},
  cell(a){
    const p=P(a.dataset.p),k=a.dataset.k;if(!p||k>today())return;
    if(p.type==='check'||p.type==='star'){setT(k,p.id,valOf(k,p.id)?null:true);render()}
    else cellSheet(p.id,k);
  },
  closeSheet(){closeSheet()},
  mup(a){moveParam(a.dataset.p,-1)},
  mdown(a){moveParam(a.dataset.p,1)},
  medit(a){const p=P(a.dataset.p);if(!p)return;ui.draft={id:p.id,name:p.name,time:p.time||'',type:p.type,set:'circles',custom:'',unit:p.unit||'',dir:p.dir||'more'};paramSheet()},
  march(a){const p=P(a.dataset.p);if(!p)return;p.archived=true;touch();render();toast('Removed. Your past entries are kept.')},
  mrest(a){const p=P(a.dataset.p);if(!p)return;p.archived=false;touch();render()},
  addP(){ui.draft=newDraft();paramSheet()},
  ptype(a){syncDraft();ui.draft.type=a.dataset.v;paramSheet()},
  pset(a){syncDraft();ui.draft.set=a.dataset.v;paramSheet()},
  pdir(a){syncDraft();ui.draft.dir=a.dataset.v;paramSheet()},
  saveP(){
    syncDraft();const d=ui.draft;if(!d)return;
    const name=d.name.trim();
    if(!name){toast('Please give it a name');return}
    if(d.id){const p=P(d.id);if(p){p.name=name;p.time=d.time||'';p.unit=(d.unit||'').trim();if(p.type==='count')p.dir=d.dir}}
    else{
      let sym;
      if(d.type==='symbol'){
        if(d.set==='custom'){
          const g=segs(d.custom||'').slice(0,5);
          if(g.length<2){toast('Add at least two symbols');return}
          sym=g.map((x,i)=>({g:x,l:x,s:1-i/(g.length-1)}));
        }else sym=SYMSETS[d.set].opts.map(o=>Object.assign({},o));
      }
      addParam({name,type:d.type,time:d.time,unit:(d.unit||'').trim(),dir:d.dir,sym});
    }
    touch();closeSheet();render();
  },
  suggest(a){const s=SUGGEST[+a.dataset.i];if(!s)return;addParam(s);render();toast(s.name+' added')},
  stab(a){ui.stab=a.dataset.v;render();window.scrollTo(0,0)},
  jump(a){const e=document.getElementById('sec-'+a.dataset.id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},
  async saveTxt(){if(await deliver(buildTXT())){markExported();render();toast('Journal saved')}},
  async shareTxt(){
    try{const f=new File([buildTXT()],'Sadhanapada-Journal.txt',{type:'text/plain'});await navigator.share({files:[f],title:'Sadhanapada journal'});markExported();render()}
    catch(e){if(!e||e.name!=='AbortError')toast('Sharing is not available here')}
  },
  async copyTxt(){toast(await copyText(buildTXT())?'Journal copied':'Could not copy')},
  pickFile(){$('#filein').click()},
  pasteRestore(){openSheet('<h2>Restore from text</h2><p class="sub">Paste the full contents of your journal file.</p><textarea id="paste-in" rows="6" placeholder="Paste here"></textarea><div class="btns" style="justify-content:space-between;margin-top:18px"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn pri" data-act="doPaste">Restore</button></div>')},
  doPaste(){const t=$('#paste-in');doImport(t?t.value:'')},
  wipe(){openSheet('<h2>Erase everything?</h2><p class="sub" style="margin-top:8px;font-size:14.5px">This removes every entry, tracker and review from this device. Save your journal file first if you want to keep a copy. This cannot be undone.</p><div class="btns" style="justify-content:space-between;margin-top:20px"><button class="btn" data-act="closeSheet">Keep my data</button><button class="btn warn" data-act="wipeYes">Erase</button></div>')},
  wipeYes(){db=blank();flush();closeSheet();ui.date=today();go('home');toast('Everything was erased')}
};

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');
  if(!a||a.disabled)return;
  const fn=ACT[a.dataset.act];
  if(fn)fn(a,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(!t||!t.matches)return;
  if(t.matches('textarea'))autosize(t);
  if(t.dataset&&t.dataset.q){
    const p=t.dataset.q.split(':'),sc=p[0],id=p[1],key=sc==='d'?ui.date:ui.wk;
    setAns(sc,key,id,t.value);
    const rec=sc==='d'?db.days[key]:db.weeks[key],a=rec&&rec.a&&rec.a[id],sv=document.getElementById('sv-'+id);
    if(sv)sv.textContent=a?'Saved '+fmtT(a.at):'';
  }else if(t.dataset&&t.dataset.note){
    setNote(ui.date,t.value);
    const d=db.days[ui.date],sv=document.getElementById('sv-note');
    if(sv)sv.textContent=d&&d.n?'Saved '+fmtT(d.n.at):'';
  }else if(t.id==='psearch')applySearch(t.value);
});
$('#filein').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>doImport(String(r.result||''));
  r.onerror=()=>toast('Could not read that file');
  r.readAsText(f);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')flush();
  else{
    if(ui.tday!==today()){ui.tday=today();ui.date=today();ui.wk=wkStart(today());ui.tw=ui.wk;ui.mon=monStart(today())}
    if(ui.route==='home')render();
  }
});
window.addEventListener('pagehide',flush);

/* ============ start ============ */
function init(){
  db=load();
  ui.route=parseHash();
  render(true);
  const hero=$('#hero');
  requestAnimationFrame(()=>hero.classList.add('in'));
  setTimeout(()=>hero.classList.add('out'),1500);
  setTimeout(()=>{if(hero.parentNode)hero.parentNode.removeChild(hero)},2500);
  try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
window.__sd={ACT,go,render,ui,init,get db(){return db},set db(v){db=v},buildTXT,importText,computeReview,ctxFor,reviewStarts,vHome,unseenReview,addParam,setT,setAns,setNote,persist};
/* offline + installable */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
init();
</script>
</body>
